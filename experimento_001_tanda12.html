<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EXPERIMENTO 001 - Tanda 12 - Misión 2: Sector Industrial</title>
<style>
* {
    box-sizing: border-box;
    touch-action: none;
    user-select: none;
}
body {
    margin: 0;
    background: #10151b;
    overflow: hidden;
}
canvas {
    display: block;
    width: 100vw;
    height: 100dvh;
    image-rendering: pixelated;
}
.controls {
    position: fixed;
    bottom: 12px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
}
.group {
    display: flex;
    gap: 6px;
    align-items: center;
}
button {
    width: 56px;
    height: 60px;
    border: 2px solid #aab6c2;
    border-radius: 12px;
    background: #263541dd;
    color: white;
    font-size: 21px;
    font-weight: bold;
}
button.active { background: #008caa; }
button.utility {
    width: 48px;
    height: 50px;
    font-size: 13px;
    border-color: #8eb6c4;
    background: #294653e8;
}
/* TANDA 6: boton COMERCIAR grande y visible, solo cerca de la Casa de Cambio.
   Va centrado, ENCIMA de la barra de botones tactiles, sin tapar ninguno. */
.trade-btn {
    display: none;
    position: fixed;
    bottom: 78px;
    left: 50%;
    transform: translateX(-50%);
    width: 190px;
    height: 50px;
    font-size: 16px;
    background: #ffe16b;
    color: #10151b;
    border: 3px solid #ffffff;
    border-radius: 14px;
    animation: tradePulse 0.9s infinite alternate;
    z-index: 5;
}
@keyframes tradePulse {
    from { box-shadow: 0 0 2px rgba(255,225,107,0.25); }
    to   { box-shadow: 0 0 24px rgba(255,225,107,0.95); }
}
.fire {
    background: #754329ee;
    border-color: #e6a66c;
}
</style>
</head>
<body>

<canvas id="game" width="640" height="360"></canvas>

<div class="controls">
    <div class="group">
        <button id="left">◀</button>
        <button id="right">▶</button>
    </div>
    <div class="group">
        <button id="crouch">↓</button>
        <button id="jump">⬆</button>
        <button id="run" class="utility">RUN</button>
        <button id="dodgeBtn" class="utility">ESQ</button>
        <button id="shootRight" class="fire">●</button>
        <button id="targetBtn" class="utility">OBJ</button>
        <button id="mythicBtn" class="utility">★</button>
        <button id="skillTree" class="utility">HAB</button>
    </div>
</div>

<button id="tradeBtn" class="trade-btn">🛒 COMERCIAR</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 640;
const H = 360;
const floor = 300;
const WORLD_WIDTH = 9600;
const END_X = 9500;
let currentMission = 1; // TANDA 12: soporte para múltiples misiones (M1 y M2)

const keys = {};
const activePointers = {};

function control(id, key) {
    const btn = document.getElementById(id);
    if (!activePointers[key]) activePointers[key] = new Set();

    btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        activePointers[key].add(e.pointerId);
        keys[key] = true;
        btn.classList.add("active");
        btn.setPointerCapture(e.pointerId);
    });

    function release(e) {
        activePointers[key].delete(e.pointerId);
        keys[key] = activePointers[key].size > 0;
        if (!keys[key]) btn.classList.remove("active");
    }

    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointercancel", release);
    btn.addEventListener("lostpointercapture", release);
}

control("left", "left");
control("right", "right");
control("jump", "jump");
control("crouch", "crouch");
control("run", "run");
control("dodgeBtn", "dodge");
control("shootRight", "shoot");
// TANDA 7: la mítica ya no tiene dos botones (PWR + ↻). El botón ★ la usa:
// tocar = activar la mítica seleccionada, mantener 0.5 s y soltar = cambiar
// a la siguiente. En PC siguen E (usar) y Q (cambiar).
(function () {
    const btn = document.getElementById("mythicBtn");
    let downAt = 0;
    btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        downAt = Date.now();
        btn.classList.add("active");
        btn.setPointerCapture(e.pointerId);
    });
    btn.addEventListener("pointerup", () => {
        btn.classList.remove("active");
        if (Date.now() - downAt >= 500) {
            keys.cycleMythic = true;
            setTimeout(() => { keys.cycleMythic = false; }, 90);
        } else {
            keys.ability = true;
            setTimeout(() => { keys.ability = false; }, 90);
        }
    });
    btn.addEventListener("pointercancel", () => btn.classList.remove("active"));
})();
// TANDA 8: botón OBJ: cada toque cambia el objetivo del auto-apuntado
// al siguiente enemigo vivo en rango (terrestre o volador).
document.getElementById("targetBtn").addEventListener("pointerdown", e => {
    e.preventDefault();
    cycleAimTarget();
    const b = document.getElementById("targetBtn");
    b.classList.add("active");
    setTimeout(() => b.classList.remove("active"), 120);
});
document.getElementById("skillTree").addEventListener("pointerdown", e => {
    e.preventDefault();
    toggleSkillTree();
});
// TANDA 6: boton COMERCIAR (solo visible cerca de la Casa de Cambio).
document.getElementById("tradeBtn").addEventListener("pointerdown", e => {
    e.preventDefault();
    if (isNearTradeHouse() && !tradeOpen && !skillTreeOpen && !missionComplete && !gameOver) openTrade();
});
// TANDA 7: el botón ESQ muestra el enfriamiento de la esquiva.
function updateDodgeButton() {
    const btn = document.getElementById("dodgeBtn");
    if (!btn) return;
    btn.style.opacity = Date.now() >= player.dodgeCooldownUntil ? "1" : "0.45";
}

// TANDA 6: muestra / oculta el boton COMERCIAR segun la posicion (se llama en draw()).
function updateTradeButton() {
    const btn = document.getElementById("tradeBtn");
    if (!btn) return;
    const show = isNearTradeHouse() && !tradeOpen && !skillTreeOpen &&
        !choiceOpen && !missionComplete && !gameOver;
    btn.style.display = show ? "block" : "none";
}

window.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    if (key.startsWith("arrow") || key === " " || key === "tab") e.preventDefault();

    // TANDA 8: cualquier tecla salta la cinemática del jefe.
    if (bossCinematicFrames > 0) { endBossCinematic(); return; }

    // TANDA 6: cualquier tecla descarta el dialogo inferior.
    if (dialogueUntil > Date.now()) dialogueUntil = 0;
    if (!dropMachineActive && !skillTreeOpen && cy >= 8 && cy <= 30) {
        if (cx >= 172 && cx <= 204) {
            if (currentMission !== 1) switchMission(1);
            return;
        } else if (cx >= 206 && cx <= 238) {
            if (currentMission !== 2) switchMission(2);
            return;
        }
    }
    // TANDA 6: al terminar la DROP, T / Espacio / Enter abre el arbol.
    if (dropFinished && !skillTreeOpen && (key === "t" || key === " " || key === "enter")) {
        openSkillTreeFromDrop();
        return;
    }

    // TANDA 5: decisiones y comercio tienen prioridad sobre el resto.
    if (choiceOpen) {
        if (key === "1") applyChoice(1);
        else if (key === "2") applyChoice(2);
        return;
    }
    if (tradeOpen) {
        if (key === "0" || key === "escape") closeTrade();
        else if (tradeStep === "menu" && (key === "1" || key === "2" || key === "3")) {
            tradeAction = Number(key); tradeStep = "familia";
        } else if (tradeStep === "familia" && key >= "1" && key <= "6") {
            tradePickFamily(Number(key));
        }
        return;
    }
    // TANDA 9: la caja de suministros YA NO se agarra con E ni tocándola:
    // se abre AGACHÁNDOSE junto a ella (~0.8 s). E queda libre para la
    // Casa de Cambio y para la mítica, como antes.
    // TANDA 8: TAB cambia el objetivo del auto-apuntado (X es disparar,
    // Q cambia la mítica, así que TAB es la tecla libre para esto).
    if (key === "tab" && !skillTreeOpen && !missionComplete && !gameOver) {
        cycleAimTarget();
        return;
    }
    // TANDA 5: E junto a la Casa de Cambio abre el comercio (no el poder mitico).
    if (key === "e" && isNearTradeHouse() && !skillTreeOpen && !missionComplete && !gameOver) {
        openTrade();
        return;
    }

    if (key === "arrowleft" || key === "a") keys.left = true;
    if (key === "arrowright" || key === "d") keys.right = true;
    if (key === "arrowup" || key === "w") keys.up = true;
    if (key === "arrowdown" || key === "s") keys.crouch = true;
    if (key === " " || key === "z") keys.jump = true;
    if (key === " " && !e.repeat && missionComplete && dropMachineActive) dropPlungerStartCharge();
    if (key === "x" || key === "control") keys.shoot = true;
    if (key === "shift") keys.run = true;
    if (key === "c") keys.dodge = true;
    if (key === "r") keys.reload = true;
    if (key === "e") keys.ability = true;
    if (key === "q") keys.cycleMythic = true;
    if (key === "t") toggleSkillTree();
    if (skillTreeOpen && key >= "1" && key <= "6") buySkillLevel(Number(key) - 1);
});

window.addEventListener("keyup", e => {
    const key = e.key.toLowerCase();

    if (key === "arrowleft" || key === "a") keys.left = false;
    if (key === "arrowright" || key === "d") keys.right = false;
    if (key === "arrowup" || key === "w") keys.up = false;
    if (key === "arrowdown" || key === "s") keys.crouch = false;
    if (key === " " || key === "z") keys.jump = false;
    if (key === " ") dropPlungerRelease();
    if (key === "x" || key === "control") keys.shoot = false;
    if (key === "shift") keys.run = false;
    if (key === "c") keys.dodge = false;
    if (key === "r") keys.reload = false;
    if (key === "e") keys.ability = false;
    if (key === "q") keys.cycleMythic = false;
});

window.addEventListener("blur", () => {
    Object.keys(keys).forEach(k => keys[k] = false);
});

function isFiring() {
    return !!keys.shoot;
}

function equipWeapon(weaponId) {
    const wp = WEAPONS[weaponId];
    player.weapon = weaponId;
    if (weaponId === "pistol") {
        player.magazine = Infinity;
        player.reserveAmmo = 0;
        player.ammo = Infinity;
    } else {
        player.magazine = Math.min(wp.magSize, wp.ammo);
        player.reserveAmmo = Math.max(0, wp.ammo - player.magazine);
        player.ammo = wp.ammo;
    }
    player.reloadUntil = 0;
}

function startReload() {
    if (player.weapon === "pistol" || player.reloadUntil > Date.now()) return;
    const wp = WEAPONS[player.weapon];
    if (player.magazine >= wp.magSize || player.reserveAmmo <= 0) return;
    player.reloadUntil = Date.now() + wp.reloadMs;
    showToast("RECARGANDO...");
}

function updateReload() {
    const reloadPressed = !!keys.reload && !player.reloadWas;
    player.reloadWas = !!keys.reload;
    if (reloadPressed) startReload();
    // TANDA 7: recarga AUTOMÁTICA al vaciar el cargador (ya no hay botón R
    // táctil; en PC la R sigue funcionando como recarga manual).
    if (player.weapon !== "pistol" && player.magazine <= 0 &&
        player.reserveAmmo > 0 && !player.reloadUntil) startReload();

    if (player.reloadUntil && Date.now() >= player.reloadUntil) {
        const wp = WEAPONS[player.weapon];
        const needed = wp.magSize - player.magazine;
        const loaded = Math.min(needed, player.reserveAmmo);
        player.magazine += loaded;
        player.reserveAmmo -= loaded;
        player.ammo = player.magazine + player.reserveAmmo;
        player.reloadUntil = 0;
        showToast("CARGADOR LISTO");
    }
}

let spritesFailed = false;

(function loadCaptainSprites() {
    let pending = 0;

    Object.keys(SPRITE_DEFS).forEach(name => {
        captainSprites[name] = [];

        for (let i = 0; i < SPRITE_DEFS[name]; i++) {
            const img = new Image();
            pending++;

            img.onload = () => {
                pending--;
                if (pending === 0 && !spritesFailed) spritesReady = true;
            };

            img.onerror = () => {
                spritesFailed = true;
                spritesReady = false;
                console.warn("No se pudo cargar el sprite " + name + "_" + i);
            };

            img.src = SPRITE_DATA[name][i];
            captainSprites[name].push(img);
        }
    });
})();

let doorWarnings = [];
function doorWarningActive(x) {
    return doorWarnings.some(w => w.x === x && gameFrame < w.until);
}
function pushDoorWarning(x) {
    doorWarnings.push({ x: x, until: gameFrame + 45 });
    if (doorWarnings.length > 12) doorWarnings = doorWarnings.slice(-12);
}
// Puertas del mapa actual (superficie: puertas de casas/negocios;
// subterráneo: alcantarillas).
function currentDoors() {
    if (routeMap === "underground") return MANHOLES.slice();
    return SPAWN_STRUCTURES.map(b => b.door);
}
function nearestDoorX(x) {
    const doors = currentDoors();
    let best = null, bestD = Infinity;
    doors.forEach(d => { const dd = Math.abs(d - x); if (dd < bestD) { bestD = dd; best = d; } });
    return best;
}
function nearestDoorInRange(minX, maxX, preferX) {
    const doors = currentDoors().filter(d => d >= minX && d <= maxX);
    if (!doors.length) return null;
    let best = doors[0], bestD = Math.abs(doors[0] - preferX);
    doors.forEach(d => { const dd = Math.abs(d - preferX); if (dd < bestD) { bestD = dd; best = d; } });
    return best;
}
// TANDA 11: ¿de qué puerta sale este spawn? Nunca en suelo abierto y
// nunca más allá de la puerta de oleada que lo bloquea: la X de aparición
// se fija a una puerta visible, dentro de la arena actual.
function resolveSpawnX(spec, waveIndex) {
    const gate = (Number.isInteger(waveIndex) && waveIndex >= 0 && GATES[waveIndex] !== undefined)
        ? GATES[waveIndex] : null;
    const maxX = gate !== null ? gate - 60 : Infinity;
    let x;
    if (spec.entry === "door") {
        const d = nearestDoorX(spec.x !== undefined ? spec.x : player.x);
        x = d !== null ? d : (spec.x !== undefined ? spec.x : player.x + 150);
    } else if (spec.entry === "right") {
        // El que entra corriendo no aparece en el borde de la nada: sale
        // de la puerta más cercana por delante del jugador, dentro de la arena.
        const ahead = nearestDoorInRange(player.x + 120, Math.min(cameraX + W + 30, maxX), cameraX + W);
        if (ahead !== null) x = ahead;
        else {
            const d = nearestDoorX(Math.min(cameraX + W + 30, maxX));
            x = d !== null ? d : Math.min(cameraX + W + 30, maxX);
        }
    } else {
        x = spec.x !== undefined ? spec.x : player.x + 200;
        const d = nearestDoorX(x);
        if (d !== null && Math.abs(d - x) <= 150) x = d;
    }
    if (gate !== null) x = Math.min(x, gate - 60);
    x = Math.max(20, x);
    // No aparecer encima del jugador.
    if (Math.abs(x - player.x) < 50) x = Math.min(player.x + 70, gate !== null ? gate - 60 : player.x + 70);
    return x;
}

const SKILL_XP_PER_POINT = 100;
const SKILL_BRANCHES = [
    { id: "dmg",   name: "DAÑO",        short: "DAÑO", color: "#e34d4d", desc: "+8% daño por nivel",      per: 0.08, key: "damage" },
    { id: "rate",  name: "CADENCIA",    short: "CAD",  color: "#4d8be3", desc: "+7% cadencia por nivel",  per: 0.07, key: "fireRate" },

    { id: "spd",   name: "REFLEJOS",    short: "MOV",  color: "#e3c84d", desc: "+6% velocidad por nivel", per: 0.06, key: "speed" },
    { id: "crit",  name: "PRECISIÓN",   short: "CRI",  color: "#a45de3", desc: "+4% crítico por nivel",   per: 0.04, key: "crit" },
    { id: "ammo",  name: "RECICLAJE",   short: "MUN",  color: "#e3883a", desc: "+8% ahorro munición / nivel", per: 0.08, key: "ammoSave" }
];
const SKILL_COSTS = [1, 1, 2, 2, 3]; // coste del nivel 1..5
const SKILL_MAX_LEVEL = 5;
let skillLevels = [0, 0, 0, 0, 0, 0];
let skillXp = 0;
let skillPoints = 0;
let skillTreeOpen = false;

function saveSkills() {
    try {
        localStorage.setItem("experimento001_skills_v1", JSON.stringify({
            levels: skillLevels, xp: skillXp, points: skillPoints
        }));
    } catch (e) { /* sin almacenamiento: el árbol sigue valiendo en esta sesión */ }
}
function loadSkills() {
    try {
        const raw = localStorage.getItem("experimento001_skills_v1");
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.levels) && data.levels.length === 6)
            skillLevels = data.levels.map(n => Math.max(0, Math.min(5, n | 0)));
        skillXp = Math.max(0, data.xp | 0);
        skillPoints = Math.max(0, data.points | 0);
    } catch (e) { /* empieza en cero */ }
}
function getSkillBonuses() {
    const bonus = { damage: 0, fireRate: 0, invuln: 0, speed: 0, crit: 0, ammoSave: 0 };
    SKILL_BRANCHES.forEach((branch, i) => {
        bonus[branch.key] += branch.per * skillLevels[i];
    });
    return bonus;
}
function addSkillXp(amount) {
    skillXp += amount;
    while (skillXp >= SKILL_XP_PER_POINT) {
        skillXp -= SKILL_XP_PER_POINT;
        skillPoints++;
        showToast("¡PUNTO DE HABILIDAD! (" + skillPoints + ")");
    }
    saveSkills();
}
function skillLevelCost(branchIndex) {
    const level = skillLevels[branchIndex];
    if (level >= SKILL_MAX_LEVEL) return null;
    return SKILL_COSTS[level];
}
function buySkillLevel(branchIndex) {
    if (branchIndex < 0 || branchIndex >= SKILL_BRANCHES.length) return false;
    const cost = skillLevelCost(branchIndex);
    if (cost === null) { showToast("RAMA AL MÁXIMO"); return false; }
    if (skillPoints < cost) { showToast("FALTAN PUNTOS: CUESTA " + cost); return false; }
    skillPoints -= cost;
    skillLevels[branchIndex]++;
    const branch = SKILL_BRANCHES[branchIndex];
    showToast(branch.name + " " + ["I","II","III","IV","V"][skillLevels[branchIndex] - 1] + " ¡COMPRADO!");
    spawnParticles(player.x + player.w / 2, player.y + 12, 24,
        [branch.color, "#ffffff", "#ffe16b"], 3.6, 30, 4);
    saveSkills();
    return true;
}

function countCardType(typeId) {
    return cards.reduce((total, card) => total + (card.typeId === typeId ? 1 : 0), 0);
}

function rollCardRarity(minRarity) {
    const order = ["common", "rare", "epic", "legendary"];
    const minIndex = Math.max(0, order.indexOf(minRarity || "common"));
    const pool = order.slice(minIndex);
    const total = pool.reduce((sum, key) => sum + CARD_RARITIES[key].weight, 0);
    let roll = Math.random() * total;
    for (const key of pool) {
        roll -= CARD_RARITIES[key].weight;
        if (roll <= 0) return key;
    }
    return pool[pool.length - 1];
}

function createCard(typeId, minRarity) {
    const type = CARD_TYPES.find(item => item.id === typeId) ||
        CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)];
    const rarity = rollCardRarity(minRarity);
    return {
        id: nextCardId++, typeId: type.id, effectId: type.id,
        name: type.name, color: type.color, rarity: rarity,
        rarityColor: CARD_RARITIES[rarity].color
    };
}

function getCardBonuses() {
    const bonus = { damage: 0, fireRate: 0, invuln: 0, speed: 0, crit: 0, ammoSave: 0 };
    cards.forEach(card => {
        const rarity = CARD_RARITIES[card.rarity] || CARD_RARITIES.common;
        const m = rarity.mult;
        if (card.typeId === "red") bonus.damage += 0.08 * m;
        if (card.typeId === "blue") bonus.fireRate += 0.07 * m;
        if (card.typeId === "green") bonus.invuln += 120 * m;
        if (card.typeId === "yellow") bonus.speed += 0.06 * m;
        if (card.typeId === "purple") bonus.crit += 0.04 * m;
        if (card.typeId === "orange") bonus.ammoSave += 0.08 * m;
    });
    activeCombos.forEach(comboId => {
        const combo = CARD_COMBOS.find(item => item.id === comboId);
        if (combo) Object.keys(combo.bonus).forEach(key => bonus[key] += combo.bonus[key]);
    });
    const skillBonus = getSkillBonuses();
    Object.keys(skillBonus).forEach(key => bonus[key] += skillBonus[key]);
    if (mythicActiveId === "absolute_adrenaline") {
        bonus.damage += 0.65;
        bonus.fireRate += 0.55;
        bonus.speed += 0.30;
        bonus.crit += 0.20;
    }
    bonus.damage = Math.min(2.2, bonus.damage);
    bonus.fireRate = Math.min(0.65, bonus.fireRate);
    bonus.speed = Math.min(0.5, bonus.speed);
    bonus.crit = Math.min(0.65, bonus.crit);
    bonus.ammoSave = Math.min(0.75, bonus.ammoSave);
    bonus.invuln = Math.min(1200, bonus.invuln);
    return bonus;
}

function canCraftCardCombo(combo) {
    return !activeCombos.includes(combo.id) &&
        Object.entries(combo.requires).every(([typeId, amount]) => countCardType(typeId) >= amount);
}

function consumeCardCombo(comboId) {
    const combo = CARD_COMBOS.find(item => item.id === comboId);
    if (!combo || !canCraftCardCombo(combo)) return false;
    Object.entries(combo.requires).forEach(([typeId, amount]) => {
        let remaining = amount;
        for (let i = cards.length - 1; i >= 0 && remaining > 0; i--) {
            if (cards[i].typeId === typeId) { cards.splice(i, 1); remaining--; }
        }
    });
    activeCombos.push(comboId);
    showToast("COMBINACIÓN: " + combo.name);
    spawnParticles(player.x + player.w / 2, player.y + 12, 24,
        ["#ffffff", "#ffe16b", "#bd70ff", "#42d9e8"], 3.6, 30, 4);
    return true;
}

function tryCraftCardCombos() {
    // Primero se comprueban recetas de tres cartas para que tengan prioridad.
    [...CARD_COMBOS].sort((a, b) =>
        Object.values(b.requires).reduce((x, y) => x + y, 0) -
        Object.values(a.requires).reduce((x, y) => x + y, 0)
    ).forEach(combo => {
        if (canCraftCardCombo(combo)) consumeCardCombo(combo.id);
    });
}

function updateMythicAbility() {
    const activatePressed = !!keys.ability && !mythicAbilityWas;
    const cyclePressed = !!keys.cycleMythic && !mythicCycleWas;
    mythicAbilityWas = !!keys.ability;
    mythicCycleWas = !!keys.cycleMythic;

    if (cyclePressed && mythicInventory.length > 1) {
        activeMythicIndex = (activeMythicIndex + 1) % mythicInventory.length;
        const selected = MYTHIC_CARDS.find(item => item.id === mythicInventory[activeMythicIndex]);
        showToast("PODER: " + selected.name);
    }
    if (!activatePressed) return;
    if (!mythicInventory.length) {
        showToast("NO TIENES PODER MÍTICO");
        return;
    }
    if (Date.now() < mythicCooldownUntil || mythicActiveId) {
        showToast("PODER MÍTICO EN RECARGA");
        return;
    }

    const mythic = MYTHIC_CARDS.find(item => item.id === mythicInventory[activeMythicIndex]);
    if (!mythic) return;
    mythicCooldownUntil = Date.now() + mythic.cooldown;

    if (mythic.id === "orbital_bombardment") {
        const targetX = player.x + player.facing * 180;
        const targetY = player.y + player.h / 2;
        enemies.forEach(enemy => {
            const dx = enemy.x + enemy.w / 2 - targetX;
            const dy = enemy.y + enemy.h / 2 - targetY;
            if (Math.hypot(dx, dy) <= 165) {
                enemy.hp -= enemy.type === "boss" ? 18 : 30;
                enemy.flash = 10;
            }
        });
        enemyBullets = enemyBullets.filter(b =>
            Math.hypot(b.x - targetX, b.y - targetY) > 170);
        for (let i = 0; i < 5; i++) {
            spawnParticles(targetX + (Math.random() - 0.5) * 100,
                targetY + (Math.random() - 0.5) * 55, 24,
                ["#ffe16b", "#ff8a35", "#ffffff"], 5, 42, 5);
        }
        shakeFrames = 24;
        showToast("¡BOMBARDEO ORBITAL!");
        return;
    }

    mythicActiveId = mythic.id;
    mythicActiveUntil = Date.now() + mythic.duration;
    mythicTick = 0;
    showToast("¡" + mythic.name + "!");
    spawnParticles(player.x + player.w / 2, player.y + 12, 28,
        [mythic.color, "#ffffff"], 4, 35, 4);
}

function updateMythicEffects() {
    if (!mythicActiveId) return;
    if (Date.now() >= mythicActiveUntil) {
        mythicActiveId = null;
        showToast("PODER MÍTICO TERMINADO");
        return;
    }
    mythicTick++;
    if (mythicActiveId === "infernal_jetpack") {
        player.vy = Math.min(player.vy, -1.8);
        if (mythicTick % 9 === 0) {
            const flameX = player.x + player.w / 2;
            const flameY = player.y + player.h + 5;
            enemies.forEach(enemy => {
                if (enemy.x + enemy.w > flameX - 28 && enemy.x < flameX + 28 &&
                    enemy.y < flameY + 180 && enemy.y + enemy.h > flameY - 8) {
                    enemy.hp -= enemy.type === "boss" ? 0.7 : 1.4;
                    enemy.flash = 2;
                }
            });
            spawnParticles(flameX, flameY, 4, ["#ff8a35", "#ffe16b"], 2.5, 12, 3);
        }
    } else if (mythicActiveId === "electric_storm" && mythicTick % 24 === 0) {
        const target = enemies.filter(enemy => Math.abs(enemy.x - player.x) < 430)
            .sort((a, b) => Math.abs(a.x - player.x) - Math.abs(b.x - player.x))[0];
        if (target) {
            target.hp -= target.type === "boss" ? 3 : 5;
            target.flash = 7;
            spawnParticles(target.x + target.w / 2, target.y + 8, 16,
                ["#70dfff", "#ffffff", "#b5a2ff"], 4, 24, 3);
        }
    }

function collision(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

function spawnParticles(x, y, count, colors, speed, life, size) {
    for (let i = 0; i < count; i++) {
        if (particles.length > 220) return;

        const angle = Math.random() * Math.PI * 2;
        const v = speed * (0.35 + Math.random() * 0.65);

        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * v,
            vy: Math.sin(angle) * v - 0.6,
            g: 0.12,
            life: life * (0.6 + Math.random() * 0.4),
            max: life,
            size: size,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

// ---------------- ENEMIGOS ----------------

function spawnEnemy(type, x, spec, waveIndex) {
    const t = ENEMY_TYPES[type];
    const door = spec && spec.entry === "door";

    enemies.push({
        type: type,
        waveIndex: Number.isInteger(waveIndex) ? waveIndex : -1,
        x: x,
        y: floor - t.h,
        w: t.w, h: t.h,
        hp: t.hp, maxHp: t.hp,
        speed: t.speed,
        facing: -1,
        flash: 0,
        emerge: door ? 40 : 0,
        holdX: spec && spec.hold !== undefined ? spec.hold : null,
        burstLeft: 0,
        burstAt: 0,
        nextShot: Date.now() + t.shootMin + Math.random() * t.shootRange + (door ? 700 : 0)
    });
    // TANDA 5: campos de los enemigos especiales.
    const e = enemies[enemies.length - 1];
    e.hidden = (type === "trapper"); // emboscador: escondido hasta que te acercas
    e.flyBase = floor - 110;
    e.flyPhase = Math.random() * 6.28;
    e.shieldHits = 0;          // TANDA 7: golpes frontales que lleva el escudo
    e.shieldBrokenUntil = 0;   // TANDA 7: hasta cuando esta roto el escudo
    if (type === "drone") e.y = e.flyBase;
}

function runSpawn(spec, waveIndex, spawnX) {
    // TANDA 11: el enemigo NUNCA aparece de la nada en suelo abierto ni
    // más allá de la puerta de su oleada: sale de una puerta visible
    // (casa/negocio, o alcantarilla en el subterráneo), dentro de la
    // arena actual. La X se resolvió al programar el spawn y se vuelve a
    // fijar aquí por si el jugador o la puerta se movieron desde entonces.
    let x = (spawnX !== undefined && spawnX !== null) ? spawnX : resolveSpawnX(spec, waveIndex);
    const gate = (Number.isInteger(waveIndex) && waveIndex >= 0 && GATES[waveIndex] !== undefined)
        ? GATES[waveIndex] : null;
    if (gate !== null) x = Math.min(x, gate - 60);
    x = Math.max(20, x);

    spawnEnemy(spec.type, x, spec, waveIndex);
    const spawned = enemies[enemies.length - 1];
    // Su punto de parada tampoco puede quedar más allá de la puerta.
    if (gate !== null && spawned.holdX !== null && spawned.holdX > gate - 80) spawned.holdX = gate - 80;
    spawned.spawnDoorX = x;
    // Sale de la puerta: emerge visible (no aparece de golpe) y la puerta
    // avisa con luz y "!" mientras sale.
    if (spec.entry === "door" || spec.entry === "right") spawned.emerge = Math.max(spawned.emerge, 30);
    pushDoorWarning(x);
    // TANDA 8: cinemática de entrada del jefe: cae del cielo y entra
    // caminando (~3 s, se puede saltar). Todo lo demás queda en pausa.
    if (spec.type === "boss" && !bossCinematicShown) {
        bossCinematicShown = true;
        const b = enemies[enemies.length - 1];
        b.y = -80;
        bossCinematicEnemy = b;
        bossCinematicFrames = 180;
        shakeFrames = 20;
        showToast("¡EL COMANDANTE EXPERIMENTAL!");
    }
    // TANDA 10: los jefes de ruta NO tienen cinemática del final, pero sí
    // su propio aviso: nombre en grande y sacudida al aparecer.
    if ((spec.type === "ratking" || spec.type === "mayor") && !routeBossSpawned) {
        routeBossSpawned = true;
        shakeFrames = 14;
        showZoneMessage(spec.type === "ratking" ? "¡REY RATA DEL SUBTERRÁNEO!" : "¡CENTINELA MAYOR!");
        showToast(spec.type === "ratking" ? "JEFE DE RUTA: ¡EL REY RATA CARGA Y CRÍA RATAS!" : "JEFE DE RUTA: ¡EL CENTINELA MAYOR Y SU ESCUDO!");
    }
}

function enemyShoot(enemy) {
    const t = ENEMY_TYPES[enemy.type];

    // No disparan mientras están fuera de la pantalla.
    if (enemy.x < cameraX - 10 || enemy.x > cameraX + W + 10) return;

    const startX = enemy.x + enemy.w / 2;
    const startY = enemy.y + t.muzzle;

    const dx = player.x + player.w / 2 - startX;
    const dy = player.y + player.h / 2 - startY;
    const base = Math.atan2(dy, dx);

    for (let i = 0; i < t.pellets; i++) {
        const angle = base + (i - (t.pellets - 1) / 2) * (t.spread || 0.22);

        enemyBullets.push({
            x: startX,
            y: startY,
            vx: Math.cos(angle) * t.bspeed,
            vy: Math.sin(angle) * t.bspeed,
            w: 7, h: 5
        });
    }
}

// ---------------- JUGADOR ----------------

function damagePlayer() {
    if (player.invulnerable || gameOver || missionComplete) return;

    player.lives--;
    player.invulnerable = true;
    player.hitUntil = Date.now() + 1800 + getCardBonuses().invuln;

    spawnParticles(player.x + player.w / 2, player.y + 14, 14,
        ["#42d9e8", "#ffffff", "#ff6347"], 3, 24, 3);
    shakeFrames = 10;

    // Regla de cartas: cada golpe suelta exactamente una carta normal al azar,
    // que queda en el suelo 5 segundos. En el golpe final no se suelta ninguna,
    // para poder continuar desde el punto de control conservando las cartas.
    if (cards.length > 0 && player.lives > 0) {
        const card = cards.splice(Math.floor(Math.random() * cards.length), 1)[0];

        pickups.push({
            kind: "card", card: card,
            x: player.x + 4, y: player.y,
            w: 12, h: 16,
            vx: (Math.random() - 0.5) * 3, vy: -5,
            life: CARD_DROP_FRAMES, delay: 50
        });

        showToast("SOLTASTE UNA CARTA");
    }

    if (player.lives <= 0) {
        player.lives = 0;
        gameOver = true;
        player.deadAt = performance.now();
        spawnParticles(player.x + player.w / 2, player.y + 16, 20,
            ["#42d9e8", "#ffffff", "#ff6347"], 3.5, 34, 4);
    } else {
        player.hurtUntil = performance.now() + HURT_MS;
    }
}

function updatePlayer() {
    const prevX = player.x;
    const cardSpeed = 1 + getCardBonuses().speed;
    // TANDA 7: ESQUIVA (botón ESQ / tecla C): dash corto con 0.4 s de
    // invulnerabilidad y 2 s de enfriamiento. El enfoque es esquivar.
    const dodgePressed = !!keys.dodge && !player.dodgeWas;
    player.dodgeWas = !!keys.dodge;
    if (dodgePressed && !gameOver && !missionComplete &&
        Date.now() >= player.dodgeCooldownUntil) {
        player.dodgeCooldownUntil = Date.now() + 2000;
        player.dodgeUntil = Date.now() + 350;
        player.invulnerable = true;
        player.hitUntil = Math.max(player.hitUntil, Date.now() + 400);
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 10,
            ["#7ff3ff", "#ffffff"], 3, 18, 3);
    }
    const dodging = Date.now() < player.dodgeUntil;
    const moveSpeed = (keys.run ? player.speed * 1.5 : player.speed) * cardSpeed;
    player.moving = false;
    updateReload();

    if (keys.left) {
        player.x -= moveSpeed;
        player.facing = -1;
        player.moving = true;
    }

    if (keys.right) {
        player.x += moveSpeed;
        player.facing = 1;
        player.moving = true;
    }

    // Durante la esquiva, el Capitán se lanza hacia donde mira.
    if (dodging) {
        player.x += player.facing * player.speed * cardSpeed * 1.6;
        player.moving = true;
        if (gameFrame % 3 === 0) spawnParticles(player.x + player.w / 2,
            player.y + player.h / 2, 1, ["#7ff3ff"], 1, 8, 2);
    }

    // Si se pulsan ambas direcciones a la vez no hay desplazamiento real.
    if (keys.left && keys.right) player.moving = false;

    player.h = keys.crouch && player.grounded
        ? player.crouchH
        : player.normalH;

    // Barricadas: bloquean el paso lateral (hay que saltarlas).
    BARRICADES.forEach(b => {
        if (player.x + player.w > b.x && player.x < b.x + b.w &&
            player.y + player.h > b.y + 4 && player.y < b.y + b.h) {
            if (prevX + player.w / 2 < b.x + b.w / 2) player.x = b.x - player.w;
            else player.x = b.x + b.w;
        }
    });

    if (player.grounded) player.y = player.groundY - player.h;

    // Un salto por pulsación; si sueltas el botón pronto, el salto es más corto.
    const jumpPressed = keys.jump && !player.jumpWas;
    player.jumpWas = !!keys.jump;

    if (jumpPressed && player.grounded && !keys.crouch) {
        player.vy = -9;
        player.grounded = false;
    }

    if (!keys.jump && player.vy < -3) player.vy *= 0.6;

    const prevBottom = player.y + player.h;
    player.vy += mythicActiveId === "infernal_jetpack" ? 0.12 : 0.4;
    player.y += player.vy;
    if (mythicActiveId === "infernal_jetpack" && player.y < 55) {
        player.y = 55;
        player.vy = 0;
    }

    // Suelo, o la parte de arriba de una barricada si caes encima.
    let support = floor;

    BARRICADES.forEach(b => {
        if (player.x + player.w > b.x && player.x < b.x + b.w &&
            prevBottom <= b.y + 2 && player.y + player.h >= b.y && b.y < support) {
            support = b.y;
        }
    });

    // TANDA 10: las plataformas sostienen al jugador solo si son de su
    // ruta (las de la otra ruta no existen en este mapa).
    PLATFORMS.forEach(p => {
        if (!platformActive(p)) return;
        if (player.x + player.w > p.x && player.x < p.x + p.w &&
            prevBottom <= p.y + 2 && player.y + player.h >= p.y && p.y < support) {
            support = p.y;
        }
    });

    if (player.y + player.h >= support) {
        if (!player.grounded) player.landedAt = performance.now();
        player.y = support - player.h;
        player.vy = 0;
        player.grounded = true;
        player.groundY = support;
    } else {
        player.grounded = false;
    }

    // TANDA 5 - PUERTA DE OLEADA: no se cruza hasta limpiar la oleada activa.
    const gateX = activeGateX();
    if (gateX !== null && player.x + player.w > gateX) player.x = gateX - player.w;

    player.x = Math.max(0, Math.min(WORLD_WIDTH - player.w, player.x));

    if (player.invulnerable && Date.now() > player.hitUntil) {
        player.invulnerable = false;
    }
}

function updateCamera() {
    const target = player.x - W * 0.38;

    cameraX += (target - cameraX) * 0.09;
    cameraX = Math.max(0, Math.min(WORLD_WIDTH - W, cameraX));
}

// TANDA 7: AUTO-APUNTADO. El juego apunta solo: al disparar busca el enemigo
// vivo más cercano en rango y prefiere a los voladores (dron / en el aire),
// así el jugador solo dispara y se concentra en esquivar. Apuntar arriba con
// W / flecha arriba sigue siendo anulación manual.
let aimTarget = null;
// TANDA 8: CAMBIO DE OBJETIVO. El auto-apuntado sigue funcionando solo,
// pero el jugador puede fijar otro objetivo: botón OBJ, tecla TAB, o tocar
// directamente al enemigo en pantalla. El objetivo fijado a mano (FIJO)
// se mantiene hasta que muere, sale de rango o se cambia a otro; solo
// entonces el auto-apuntado vuelve a elegir solo (volador preferido).
let aimLocked = null;       // enemigo fijado a mano (o null = automático)
let aimLockedManual = false;
const ENEMY_LABELS = {
    grunt: "SOLDADO", runner: "CORREDOR", gunner: "ARTILLERO", heavy: "PESADO",
    boss: "COMANDANTE EXPERIMENTAL", scout: "EXPLORADOR DE PLAYA",
    shield: "CENTINELA ACORAZADO", trapper: "EMBOSCADOR", drone: "DRON EXPERIMENTO 7",
    ratking: "REY RATA DEL SUBTERRÁNEO", mayor: "CENTINELA MAYOR"
};
function enemyLabel(e) {
    return ENEMY_TYPES[e.type]?.label || ENEMY_LABELS[e.type] || e.type.toUpperCase();
}
function aimInRange(e) {
    if (!e || e.hp <= 0 || e.emerge > 0 || e.hidden) return false;
    const pcx = player.x + player.w / 2, pcy = player.y + 14;
    const dx = (e.x + e.w / 2) - pcx, dy = (e.y + e.h / 2) - pcy;
    return Math.abs(dx) <= 460 && Math.abs(dy) <= 300;
}
// Enemigos en rango, ordenados como el auto-apuntado (voladores preferidos).
function getAimCandidates() {
    const pcx = player.x + player.w / 2;
    const pcy = player.y + 14;
    const list = [];
    enemies.forEach(enemy => {
        if (!aimInRange(enemy)) return;
        const ecx = enemy.x + enemy.w / 2;
        const ecy = enemy.y + enemy.h / 2;
        const dx = ecx - pcx, dy = ecy - pcy;
        const flying = enemy.type === "drone" || enemy.y + enemy.h < floor - 40;
        list.push({ enemy, score: Math.hypot(dx, dy) - (flying ? 220 : 0) });
    });
    list.sort((a, b) => a.score - b.score);
    return list.map(item => item.enemy);
}
function getAutoAimTarget() {
    const c = getAimCandidates();
    return c.length ? c[0] : null;
}
function clearAimLockIfInvalid() {
    if (aimLocked && !aimInRange(aimLocked)) { aimLocked = null; aimLockedManual = false; }
}
function resolveAimTarget() {
    clearAimLockIfInvalid();
    if (aimLocked) return aimLocked;
    return getAutoAimTarget();
}
function lockAimTarget(e) {
    if (!aimInRange(e)) return false;
    aimLocked = e; aimLockedManual = true; aimTarget = e;
    return true;
}
// Pasa al siguiente enemigo en rango (vuelve al primero al final).
function cycleAimTarget() {
    if (gameOver || missionComplete || skillTreeOpen || choiceOpen || tradeOpen) return;
    const c = getAimCandidates();
    if (!c.length) { aimLocked = null; aimLockedManual = false; showToast("SIN OBJETIVO EN RANGO"); return; }
    // TANDA 8: la primera pulsación cambia DESDE el objetivo automático
    // actual al siguiente (no vuelve a fijar el mismo: ese era el problema
    // reportado: con volador + terrestre no se podía pasar al terrestre).
    const current = aimLocked || getAutoAimTarget();
    const i = current ? c.indexOf(current) : -1;
    const next = c[(i + 1) % c.length];
    lockAimTarget(next);
    showToast("OBJETIVO: " + enemyLabel(next));
}
function getAutoAimTarget() {
    const c = getAimCandidates();
    return c.length ? c[0] : null;
}

function updateShooting() {
    if (!isFiring() || player.reloadUntil > Date.now()) return;

    const wp = WEAPONS[player.weapon];
    const cardBonus = getCardBonuses();
    const effectiveCooldown = wp.cooldown / (1 + cardBonus.fireRate);
    if (Date.now() - lastShot < effectiveCooldown) return;

    if (player.weapon !== "pistol" && player.magazine <= 0) {
        if (player.reserveAmmo > 0) startReload();
        else {
            equipWeapon("pistol");
            showToast("SIN MUNICION: PISTOLA");
        }
        return;
    }

    // Apuntar arriba usa un origen real a la altura del arma, no sobre la cabeza.
    const cx = player.x + player.w / 2;
    const aimingUp = !!keys.up;
    // TANDA 7/8: auto-apuntado (salvo apuntado manual hacia arriba).
    // Si hay un objetivo FIJO a mano, se dispara a ese; si no, al automático.
    clearAimLockIfInvalid();
    const aim = aimingUp ? null : resolveAimTarget();
    aimTarget = aim || aimLocked;
    if (aim) player.facing = (aim.x + aim.w / 2 >= cx) ? 1 : -1;
    const dir = player.facing;
    const mx = aimingUp ? cx : cx + dir * 14;
    const my = aimingUp
        ? player.y + (player.h === player.crouchH ? 8 : 12)
        : player.y + (keys.crouch && player.grounded ? 12 : 14);
    const baseAngle = aim
        ? Math.atan2((aim.y + aim.h / 2) - my, (aim.x + aim.w / 2) - mx)
        : (aimingUp ? -Math.PI / 2 : (dir === 1 ? 0 : Math.PI));

    for (let i = 0; i < wp.pellets; i++) {
        let angle = baseAngle;
        if (wp.pellets > 1) angle += (i / (wp.pellets - 1) - 0.5) * wp.spread;
        angle += (Math.random() - 0.5) * wp.jitter * 2;

        const vx = Math.cos(angle) * wp.speed;
        const vy = Math.sin(angle) * wp.speed;
        const horizontal = Math.abs(vx) >= Math.abs(vy);
        let w = horizontal ? wp.len : wp.thick;
        let h = horizontal ? wp.thick : wp.len;
        if (wp.pellets > 1) { w = wp.len; h = wp.len; }

        const critical = Math.random() < cardBonus.crit;
        bullets.push({
            x: mx - w / 2, y: my - h / 2,
            w: w, h: h, vx: vx, vy: vy,
            hit: false,
            dmg: wp.dmg * (1 + cardBonus.damage) * (critical ? 2 : 1),
            critical: critical, pierce: !!wp.pierce,
            hits: [], dist: 0, maxDist: wp.maxDist || 0,
            color: critical ? "#ffffff" : wp.color
        });
    }

    spawnParticles(mx, my, 3, ["#fff6b0", "#ffd24a"], 1.6, 6, 3);
    lastShot = Date.now();

    if (player.weapon !== "pistol") {
        if (Math.random() >= cardBonus.ammoSave) player.magazine--;
        player.ammo = player.magazine + player.reserveAmmo;
        if (player.magazine <= 0) {
            if (player.reserveAmmo > 0) startReload();
            else {
                equipWeapon("pistol");
                showToast("SIN MUNICION: PISTOLA");
            }
        }
    }
}

function updateBullets() {
    bullets.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
        b.dist += Math.abs(b.vx) + Math.abs(b.vy);

        enemies.forEach(enemy => {
            if (b.hit || enemy.hp <= 0 || enemy.emerge > 0) return;
            // TANDA 9: disparar al montículo de un Emboscador escondido lo
            // hace saltar (esa bala no le hace daño, solo lo revela).
            if (enemy.hidden) {
                if (enemy.type === "trapper" && collision(b, enemy)) {
                    revealTrapper(enemy, enemy.x + enemy.w / 2);
                }
                return;
            }
            if (b.pierce && b.hits.includes(enemy)) return;

            if (collision(b, enemy)) {
                // TANDA 7: el Centinela ya NO es inmortal de frente. El escudo
                // reduce el daño a la mitad (chip damage) y se ROMPE a los 3
                // impactos frontales: queda roto 4 s y ahí recibe daño completo.
                // El láser atraviesa y por la espalda siempre hace daño completo.
                if ((enemy.type === "shield" || enemy.type === "mayor") && !b.pierce &&
                    Math.sign(b.vx) === -enemy.facing &&
                    Date.now() >= enemy.shieldBrokenUntil) {
                    enemy.shieldHits = (enemy.shieldHits || 0) + 1;
                    enemy.hp -= b.dmg * 0.5;
                    enemy.flash = 4;
                    spawnParticles(b.x, b.y, 5, ["#c8d4e0", "#ffe16b"], 2, 10, 2);
                    if (enemy.shieldHits >= 3) {
                        enemy.shieldHits = 0;
                        enemy.shieldBrokenUntil = Date.now() + 4000;
                        showToast("¡ESCUDO ROTO!");
                        spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2,
                            12, ["#ffe16b", "#ffffff"], 3, 20, 3);
                    }
                    b.hit = true;
                    return;
                }
                enemy.hp -= b.dmg;
                enemy.flash = 4;
                spawnParticles(b.x, b.y, 5, ["#ffe16b", "#ffffff"], 2.2, 14, 2);

                if (b.pierce) b.hits.push(enemy);
                else b.hit = true;
            }
        });
    });

    bullets = bullets.filter(b =>
        !b.hit &&
        (!b.maxDist || b.dist < b.maxDist) &&
        b.x > cameraX - 50 &&
        b.x < cameraX + W + 50 &&
        b.y > 0 && b.y < H
    );
}

// ---------------- OLEADAS Y ENEMIGOS ----------------

function updateWaves() {
    waves.forEach((wave, index) => {
        if (!triggeredWaves[index] && player.x >= wave.trigger) {
            triggeredWaves[index] = true;

            wave.spawns.forEach(spec => {
                // TANDA 11: la puerta de salida se fija YA, al programar el
                // spawn, para poder avisar ("!") en esa puerta antes de que salga.
                pendingSpawns.push({ at: gameFrame + (spec.delay || 0), spec: spec, waveIndex: index,
                    spawnX: resolveSpawnX(spec, index) });
            });
        }
    });

    const ready = pendingSpawns.filter(p => p.at <= gameFrame);

    if (ready.length > 0) {
        ready.forEach(p => runSpawn(p.spec, p.waveIndex, p.spawnX));
        pendingSpawns = pendingSpawns.filter(p => p.at > gameFrame);
    }
}

function updateEnemies() {
    enemies.forEach(enemy => {
        if (enemy.flash > 0) enemy.flash--;

        const pcx = player.x + player.w / 2;
        const ecx = enemy.x + enemy.w / 2;
        enemy.facing = pcx < ecx ? -1 : 1;

        // Saliendo de un edificio: no actúa ni recibe disparos todavía.
        if (enemy.emerge > 0) {
            enemy.emerge--;

            if (enemy.emerge % 8 === 0) {
                spawnParticles(ecx, floor - 4, 2, ["#8a8f93", "#aeb4b8"], 1.2, 16, 3);
            }
            return;
        }

        const t = ENEMY_TYPES[enemy.type];
        const dist = Math.abs(pcx - ecx);
        let move = 0;

        // TANDA 11 (aclaración de Quits): una puerta NUNCA puede exigir
        // matar a un enemigo que el jugador no alcanza. Si un enemigo de
        // la oleada que bloquea está más allá de la puerta, se le trae
        // de vuelta a la arena (y no vuelve a irse: su holdX se anula);
        // si lleva ~3 s lejos sin poder alcanzarlo, viene a por ti.
        if (enemy.hp > 0 && blockingWaveIndex() === enemy.waveIndex) {
            const gateX = activeGateX();
            if (gateX !== null) {
                if (enemy.x > gateX - enemy.w) {
                    enemy.x = gateX - enemy.w - 10;
                    enemy.holdX = null;
                    if (enemy.hidden) revealTrapper(enemy, enemy.x + enemy.w / 2);
                }
                const farAhead = dist > 500;
                enemy.outOfReachFrames = farAhead ? (enemy.outOfReachFrames || 0) + 1 : 0;
                if (enemy.outOfReachFrames > 180) {
                    enemy.outOfReachFrames = 0;
                    if (enemy.hidden) revealTrapper(enemy, enemy.x + enemy.w / 2);
                    enemy.x = Math.max(20, Math.min(player.x + 240, gateX - enemy.w - 10));
                    enemy.y = enemy.type === "drone" ? enemy.flyBase : floor - enemy.h;
                    enemy.holdX = null;
                    enemy.emerge = Math.max(enemy.emerge, 10);
                    showToast("¡EL ENEMIGO VIENE A POR TI!");
                }
            }
        }

        // TANDA 9 - Emboscador: antes solo saltaba a menos de 180 px, así que
        // si quedaba escondido detrás de ti (p. ej. el de X 4480 o el de
        // X 5800) la puerta se quedaba trabada para siempre: no se le podía
        // disparar (las balas y el auto-apuntado ignoran lo escondido) y
        // estaba fuera de la pantalla. Ahora salta a 320 px, y también salta
        // si su oleada es la que bloquea la puerta y ya estás parado en
        // ella: la puerta NUNCA se traba por un emboscador escondido.
        if (enemy.type === "trapper" && enemy.hidden) {
            const gateX = activeGateX();
            const stuckAtGate = gateX !== null &&
                blockingWaveIndex() === enemy.waveIndex &&
                player.x + player.w >= gateX - 40;
            if (dist < 320 || stuckAtGate) revealTrapper(enemy, ecx);
        } else if (enemy.type === "scout") {
            if (dist > 30) move = enemy.facing; // carga rapidisimo hacia ti
        } else if (enemy.type === "drone") {
            // Vuela en onda (seno) y se acerca despacio por el aire.
            enemy.y = enemy.flyBase + Math.sin(gameFrame / 18 + enemy.flyPhase) * 28;
            if (dist > 200) move = enemy.facing;
        } else if (enemy.type === "trapper") {
            // TANDA 9: ya revelado, el Emboscador te persigue (antes se
            // quedaba quieto para siempre, así que tampoco venía a por ti).
            if (dist > 60) move = enemy.facing;
        } else if (enemy.type === "ratking") {
            // TANDA 10: el Rey Rata CARGA hacia ti (más rápido de lejos) y
            // cada ~6 s cría una rata (corredor) si hay hueco en la arena.
            if (dist > 90) move = enemy.facing;
            enemy.speed = dist > 200 ? 1.8 : 0.9;
            if (enemy.hp > 0 && gameFrame % 360 === 0 && enemies.length < 14) {
                spawnEnemy("runner", enemy.x + 50, { entry: "static" }, enemy.waveIndex);
                showToast("¡EL REY RATA CRÍA UNA RATA!");
            }
        } else if (enemy.type === "mayor") {
            // TANDA 10: el Centinela Mayor avanza lento hasta su posición y
            // ahí se planta como un muro (como un pesado, pero con escudo).
            if (enemy.holdX !== null && Math.abs(enemy.x - enemy.holdX) > 2) {
                move = enemy.holdX < enemy.x ? -1 : 1;
            } else if (dist > 220) move = enemy.facing;
        } else if (enemy.type === "grunt") {
            if (enemy.x > player.x + 35) move = -1;
            else if (enemy.x < player.x - 35) move = 1;
        } else if (enemy.type === "runner") {
            if (dist > 110) move = enemy.facing;
        } else {
            if (enemy.holdX !== null && Math.abs(enemy.x - enemy.holdX) > 2) {
                move = enemy.holdX < enemy.x ? -1 : 1;
            } else if ((enemy.type === "heavy" || enemy.type === "boss") && dist > (enemy.type === "boss" ? 260 : 220)) {
                move = enemy.facing;
            }
        }

        if (move !== 0) {
            const step = move * enemy.speed;
            let nextX = enemy.x + step;
            BARRICADES.forEach(bar => {
                const verticalOverlap = enemy.y + enemy.h > bar.y + 3 && enemy.y < bar.y + bar.h;
                if (!verticalOverlap) return;

                if (step > 0 && enemy.x + enemy.w <= bar.x && nextX + enemy.w > bar.x) {
                    nextX = bar.x - enemy.w;
                } else if (step < 0 && enemy.x >= bar.x + bar.w && nextX < bar.x + bar.w) {
                    nextX = bar.x + bar.w;
                }
            });
            enemy.x = nextX;
        }

        const now = Date.now();

        // El comandante cambia a fase de furia al perder la mitad de su vida.
        if ((enemy.type === "boss" || enemy.type === "boss_m2") && !enemy.enraged && enemy.hp <= enemy.maxHp * 0.5) {
            enemy.enraged = true;
            enemy.speed = 0.52;
            enemy.nextShot = now + 350;
            showToast(enemy.type === "boss_m2" ? "¡PROTOTIPO BERSERKER: FASE DE FURIA!" : "COMANDANTE: FASE DE FURIA");
            spawnParticles(ecx, enemy.y + 18, 24,
                ["#ff6347", "#ffe16b", "#ffffff"], 3.8, 30, 4);
        }

        // TANDA 8: en el apagón los enemigos no te ven de lejos (más de 220 px).
        if (blackoutFrames > 0 && dist > 220) enemy.nextShot = Math.max(enemy.nextShot, now + 700);
        if (!enemy.hidden && now >= enemy.nextShot && enemy.burstLeft === 0) {
            enemy.burstLeft = (enemy.type === "boss" || enemy.type === "boss_m2") && enemy.enraged ? 3 : t.burst;
            enemy.burstAt = now;
            enemy.nextShot = now + ((enemy.type === "boss" || enemy.type === "boss_m2") && enemy.enraged ? 1050 : t.shootMin) +
                Math.random() * t.shootRange;
        }

        if (enemy.burstLeft > 0 && now >= enemy.burstAt) {
            enemyShoot(enemy);
            enemy.burstLeft--;
            enemy.burstAt = now + 260;
        }

        if (!enemy.hidden && collision(player, enemy)) {
            damagePlayer();
        }

        // TANDA 9: red de seguridad anti-bloqueo. Si un enemigo de la
        // oleada que bloquea la puerta lleva ~10 s (600 pasos) fuera de la
        // pantalla, regresa a la arena a la vista del jugador: ningún
        // enemigo puede quedarse fuera para siempre y trabar la partida.
        if (enemy.hp > 0 && blockingWaveIndex() === enemy.waveIndex && !["boss", "boss_m2", "ratking", "mayor", "cryo_specimen", "titan_bot"].includes(enemy.type)) {
            const esx = enemy.x - cameraX;
            if (esx < -40 || esx > W + 40) {
                enemy.offscreenFrames = (enemy.offscreenFrames || 0) + 1;
                if (enemy.offscreenFrames > 600) {
                    enemy.offscreenFrames = 0;
                    if (enemy.hidden) revealTrapper(enemy, enemy.x + enemy.w / 2);
                    enemy.x = Math.min(player.x + 260, WORLD_WIDTH - enemy.w);
                    enemy.y = enemy.type === "drone" ? enemy.flyBase : floor - enemy.h;
                    enemy.emerge = Math.max(enemy.emerge, 10);
                    showToast("¡EL ENEMIGO REGRESA A LA ARENA!");
                }
            } else {
                enemy.offscreenFrames = 0;
            }
        }
    });

    enemies = enemies.filter(enemy => {
        if (enemy.hp <= 0) {
            spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, 18,
                ["#e34d4d", "#ff9a3c", "#ffe16b", "#6b7077"], 3.4, 30, 4);
            score += ENEMY_TYPES[enemy.type].score;
            totalKills++;
            if (enemy.type === "boss" || enemy.type === "boss_m2") {
                dropBossReward(enemy.x + 18, floor - 30);
                dropMythic(enemy.x + 48, floor - 30);
                showToast("JEFE DERROTADO: RECOMPENSA MÍTICA");
            }
            // TANDA 10: el jefe de ruta cae y suelta su recompensa propia
            // (carta épica + 50 XP); la recompensa final de ruta se da al
            // completar la misión (giveRouteReward).
            if (enemy.type === "ratking" || enemy.type === "mayor" || enemy.type === "cryo_specimen" || enemy.type === "titan_bot") {
                routeBossDefeated = enemy.type;
                routeBossDefeatedByMap[routeMap || "surface"] = enemy.type;
                dropRewardCard(enemy.x + 18, floor - 30, "epic");
                addSkillXp(50);
                let bossTitle = "JEFE DE RUTA";
                if (enemy.type === "ratking") bossTitle = "REY RATA";
                else if (enemy.type === "mayor") bossTitle = "CENTINELA MAYOR";
                else if (enemy.type === "cryo_specimen") bossTitle = "ESPÉCIMEN CRIOGÉNICO";
                else if (enemy.type === "titan_bot") bossTitle = "TITÁN INDUSTRIAL";
                showToast("¡" + bossTitle + " DERROTADO! +50 XP Y CARTA ÉPICA");
            }
            return false;
        }
        return true;
    });
}

function updateEnemyBullets() {
    enemyBullets.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;

        if (collision(b, player)) {
            damagePlayer();
            b.hit = true;
        }

        // Las barricadas protegen: detienen los disparos enemigos.
        BARRICADES.forEach(bar => {
            if (!b.hit && collision(b, bar)) {
                b.hit = true;
                spawnParticles(b.x, b.y, 4, ["#b0925c", "#ffffff"], 1.8, 12, 2);
            }
        });
    });

    enemyBullets = enemyBullets.filter(b =>
        !b.hit &&
        b.x > cameraX - 80 &&
        b.x < cameraX + W + 80 &&
        b.y > 0 && b.y < H
    );
}

// ---------------- COFRES, ARMAS Y CARTAS ----------------

function updateChests() {
    chests.forEach(chest => {
        if (chest.open || !collision(player, chest)) return;

        chest.open = true;
        showToast("COFRE ABIERTO");
        spawnParticles(chest.x + chest.w / 2, chest.y, 16,
            ["#7ff3ff", "#ffffff", "#ffe16b"], 3, 26, 3);

        // Sale un arma y una carta (cada una a un lado del cofre).
        pickups.push({
            kind: "weapon", weapon: chest.weapon,
            x: chest.x + chest.w + 12, y: chest.y - 6,
            w: 16, h: 16, vx: 0.8, vy: -4,
            life: Infinity, delay: 15
        });

        const type = CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)];
        const card = createCard(type.id);
        pickups.push({
            kind: "card", card,
            x: chest.x - 24, y: chest.y - 6,
            w: 12, h: 16, vx: -0.8, vy: -4,
            life: Infinity, delay: 15
        });
    });
}

function updatePickups() {
    pickups.forEach(p => {
        p.vy += 0.3;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;

        if (p.y + p.h >= floor) {
            p.y = floor - p.h;
            p.vy = Math.abs(p.vy) > 1.2 ? -p.vy * 0.4 : 0;
            p.vx *= 0.8;
        }

        if (p.delay > 0) p.delay--;
        if (p.life !== Infinity) p.life--;

        if (p.delay <= 0 && p.life > 0 && collision(player, p)) {
            // TANDA 3 (bug): si no se pudo recoger, el objeto SE QUEDA en el
            // suelo para intentarlo después; antes se consumía aunque fallara.
            let collected = false;
            if (p.kind === "weapon") {
                const wp = WEAPONS[p.weapon];
                equipWeapon(p.weapon);
                showToast("ARMA: " + wp.name);
                collected = true;
            } else if (p.kind === "mythic") {
                collected = collectMythic(p.mythicId);
            } else {
                if (cards.length < 48 && countCardType(p.card.typeId) < CARD_MAX_STACK) {
                    cards.push(p.card);
                    const rarityName = CARD_RARITIES[p.card.rarity]?.name || "COMÚN";
                    showToast(rarityName + ": " + p.card.name);
                    tryCraftCardCombos();
                    collected = true;
                } else {
                    showToast("INVENTARIO DE CARTAS LLENO");
                }
            }
            if (!collected) return;
            spawnParticles(p.x + p.w / 2, p.y + p.h / 2, 10,
                ["#ffffff", "#7ff3ff", "#ffe16b"], 2.4, 20, 2);
            p.life = 0;
        }
    });

    // Las cartas soltadas desaparecen a los 5 segundos si no se recogen.
    pickups = pickups.filter(p => p.life > 0);
}

function updateParticles() {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.g;
        p.life--;
    });

    particles = particles.filter(p => p.life > 0);

    if (shakeFrames > 0) shakeFrames--;
}

// ---------------- MISIÓN ----------------

// TANDA 5: cronometro de mision (mm:ss) a partir de gameFrame (60 pasos/s).
function formatMissionTime() {
    const s = Math.floor(gameFrame / 60);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function waveCleared(index) {
    if (!triggeredWaves[index]) return true; // aun no empezo: no bloquea
    return !pendingSpawns.some(item => item.waveIndex === index) &&
           !enemies.some(enemy => enemy.waveIndex === index);
}
// TANDA 9: índice de la oleada que está bloqueando la puerta ahora mismo
// (-1 si ninguna bloquea). La puerta nunca debe quedarse trabada por un
// enemigo que no se puede alcanzar ni matar.
function blockingWaveIndex() {
    for (let i = 0; i < waves.length; i++) {
        if (triggeredWaves[i] && !waveCleared(i)) return i;
    }
    return -1;
}
// TANDA 9: enemigos vivos de la oleada que bloquea, del más cercano al
// más lejano (son los que faltan para que se abra la puerta).
function gateRemainingEnemies() {
    const bi = blockingWaveIndex();
    if (bi < 0) return [];
    const pcx = player.x + player.w / 2;
    return enemies
        .filter(e => e.waveIndex === bi && e.hp > 0)
        .sort((a, b) => Math.abs((a.x + a.w / 2) - pcx) - Math.abs((b.x + b.w / 2) - pcx));
}
// TANDA 9: cuántos faltan en total (vivos + los que aún van a aparecer).
function gateRemainingCount() {
    const bi = blockingWaveIndex();
    if (bi < 0) return 0;
    return gateRemainingEnemies().length +
           pendingSpawns.filter(item => item.waveIndex === bi).length;
}
// TANDA 9: hacer saltar a un Emboscador escondido (montículo con "?").
function revealTrapper(enemy, ecx) {
    if (!enemy || !enemy.hidden) return;
    enemy.hidden = false;
    enemy.emerge = 20;
    showToast("¡EMBOSCADA!");
    spawnParticles(ecx !== undefined ? ecx : enemy.x + enemy.w / 2,
        floor - 10, 12, ["#7a4de3", "#ffffff"], 3, 20, 3);
}
function activeGateX() {
    const bi = blockingWaveIndex();
    return bi < 0 ? null : GATES[bi];
}
function isNearTradeHouse() {
    return Math.abs(player.x - TRADE_X) < 100;
}
// ---------------- TANDA 8: cinemática del jefe ----------------
function endBossCinematic() {
    bossCinematicFrames = 0;

}

function drawPlatforms() {

        // TANDA 11: la misma puerta sirve para ENTRAR y para SALIR: en la

        const inTunnel = routeMap === "underground";
        ctx.fillStyle = "#ffe16b";
        ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
        ctx.fillText(inTunnel ? "SUPERFICIE" : "SUBTERRÁNEO", mx + 50, 188);
        ctx.textAlign = "left";
        if (player.x >= 4600 && player.x <= 4860) {
            ctx.fillStyle = "#ffe16b"; ctx.font = "bold 11px monospace"; ctx.textAlign = "center";
            ctx.fillText(inTunnel ? "▼ AGÁCHATE AQUÍ PARA SALIR ▼" : "▼ AGÁCHATE AQUÍ PARA BAJAR ▼", mx + 50, 170);
            if (doorCrouchFrames > 0) {
                ctx.fillStyle = "#202020"; ctx.fillRect(mx + 20, 158, 60, 5);
                ctx.fillStyle = "#4dc46a"; ctx.fillRect(mx + 20, 158, 60 * (doorCrouchFrames / 30), 5);
            }
            ctx.textAlign = "left";
        }
    }
    // Letrero de la bifurcación en X 4600 (hasta que se baje al túnel
    // por primera vez: entrar es opcional, seguir derecho también vale).
    if (!visitedUnderground && player.x >= 4300 && player.x < 6400) {
        const sx = 4600 - cameraX;
        if (sx > -80 && sx < W + 80) {

            ctx.fillStyle = "#7ff3ff";
            ctx.fillText("→ SIGUE DERECHO: SUPERFICIE · RUTA B", sx + 40, 290);
            ctx.textAlign = "left";
        }

// TANDA 11: avisos de aparición: "!" y luz amarilla en la puerta de

function drawSpawnWarnings() {

function updateEventVisuals() {
    // La caja cae hasta el suelo (con polvo al aterrizar).
    if (supplyCrate && supplyCrate.state === "falling") {
        supplyCrate.vy = Math.min(3, supplyCrate.vy + 0.25);
        supplyCrate.y += supplyCrate.vy;
        if (supplyCrate.y >= floor - 24) {
            supplyCrate.y = floor - 24;
            supplyCrate.state = "landed";
            shakeFrames = 10;
            spawnParticles(supplyCrate.x + 18, floor - 4, 14, ["#8a8f93", "#ffe16b"], 2.4, 20, 3);
            showToast("LA CAJA ATERRIZÓ: AGÁCHATE JUNTO A ELLA PARA ABRIRLA");
        }
    }
    // TANDA 9: la caja se abre AGACHÁNDOSE junto a ella ~0.8 s (48 pasos).

            showToast("RECOMPENSA DE EVENTO: CARTA RARA+");
            if (newZone === 2 && mythicInventory.length < 3) {
                dropMythic(player.x + 55, floor - 30);
                showToast("EVENTO EXTRAORDINARIO: PODER MÍTICO");
            }
        }
    }

    // Solo se completa al llegar al objetivo y eliminar todas las oleadas.
    if (player.x >= END_X && enemies.length === 0 &&
        pendingSpawns.length === 0 &&
        triggeredWaves.length === waves.length &&
        triggeredWaves.every(Boolean)) {
        missionComplete = true;
        if (!missionFinalTime) {
            missionFinalTime = formatMissionTime();
            if (!chosenRoute) chosenRoute = "B";
            giveRouteReward();
        }
        showZoneMessage("OBJETIVO COMPLETADO");
    }
}

    CHOICES.forEach(ch => ch.done = false);

// Continuar desde el último punto de control: conserva las cartas y la puntuación.
function continueFromCheckpoint() {
    // Las cartas normales y combinaciones sobreviven; las míticas se pierden al agotar las tres vidas.
    if (mythicInventory.length) showToast("LOS PODERES MÍTICOS SE HAN PERDIDO");
    mythicInventory = [];
    activeMythicIndex = 0;
    mythicActiveId = null;
    mythicActiveUntil = 0;
    mythicCooldownUntil = 0;
    player.x = checkpointX + 20;
    player.lives = 3;
    player.invulnerable = true;
    player.hitUntil = Date.now() + 2000;
    resetPlayerState();

    cameraX = Math.max(0, Math.min(WORLD_WIDTH - W, player.x - W * 0.38));
    clearCombat();

    // Las cartas soltadas se pierden; lo que salió de los cofres se conserva.
    pickups = pickups.filter(p => p.life === Infinity);

    triggeredWaves = waves.map(w => w.trigger < checkpointX);
    // TANDA 5: al continuar, los eventos/decisiones/ruta posteriores al
    // checkpoint se pueden volver a vivir.
    ZONE_EVENTS.forEach(ev => { if (ev.x >= checkpointX) ev.done = false; });
    CHOICES.forEach(ch => { if (ch.x >= checkpointX) ch.done = false; });
    // TANDA 11: al continuar el combate se limpió, así que los estados
    // por mapa empiezan frescos; el mapa es el del checkpoint.
    mapStates = { surface: makeMapState("surface"), underground: makeMapState("underground") };
    doorWarnings = [];
    doorReady = true;
    if (checkpointX < 4600) {
        chosenRoute = "B"; routeMap = "surface";
        routeBossDefeated = null; routeBossDefeatedByMap = { surface: null, underground: null };
        routeBossSpawned = false;
        waves[5].spawns = currentMission === 2 ? ROUTE_B_SPAWNS_M2 : ROUTE_B_SPAWNS;
        branchActive = false;
        chests = chests.filter(c => !c.routeChest);
        chests.push({ x: 5600, y: floor - 24, w: 30, h: 24, weapon: "shotgun", open: false, routeChest: true });
    } else if (chosenRoute) {
        routeMap = chosenRoute === "A" ? "underground" : "surface";
        waves[5].spawns = chosenRoute === "A" ? ROUTE_A_SPAWNS : ROUTE_B_SPAWNS;
        routeBossDefeated = null; routeBossDefeatedByMap = { surface: null, underground: null };
        routeBossSpawned = false;
        chests = chests.filter(c => !c.routeChest);
        chests.push({ x: 5600, y: floor - 24, w: 30, h: 24,
            weapon: chosenRoute === "A" ? "laser" : "shotgun", open: false, routeChest: true });
    }
    if (checkpointX < 8000) routeExtrasSpawned = false;
    choiceOpen = false;
    tradeOpen = false;
    blackoutFrames = 0;
    // TANDA 8: al continuar, el objetivo y los visuales de evento se reinician.
    aimLocked = null; aimLockedManual = false; aimTarget = null;
    bossCinematicFrames = 0; bossCinematicShown = false; bossCinematicEnemy = null;
    alarmFxFrames = 0; supplyCrate = null; survivorFx = null;

    gameOver = false;
    missionComplete = false;
    lastShot = 0;

    showZoneMessage("CONTINUAR: " + zones[checkpointIndex].name);
}

function startDropMachine() {
    // TANDA 6: si la DROP ya esta activa, NO reiniciarla (ese era el reseteo
    // del contador que veia Quits: cada toque volvia a poner 12 bolas).
    if (dropMachineActive) return;
    dropMachineActive = true;
    dropFinished = false;
    dropFinishedFrames = 0;
    dropFromDrop = false;
    dropBallsLaunched = 0;
    dropBalls = [];
    dropBallsRemaining = 12;
    dropBonusBalls = 0;
    dropTotalScore = 0;
    dropResolved = 0;
    dropPlungerPower = 0;
    dropPlungerCharging = false;
    dropFrame = 0;
    dropPegShift = 0;
    DROP_BUMPERS.forEach(b => b.flash = 0);
    showToast("DROP MACHINE: ¡CARGA EL RESORTE Y LANZA!");
}

// TANDA 6: la DROP termina cuando no quedan bolas por lanzar ni en juego.
function finishDropMachine() {
    if (!dropMachineActive) return;
    dropMachineActive = false;
    dropFinished = true;
    dropFinishedFrames = 150; // ~2.5 s de pantalla "DROP TERMINADO"
    showToast("DROP TERMINADO: +" + dropTotalScore + " XP");
}
// TANDA 6: al terminar la DROP se abre el arbol de habilidades.
function openSkillTreeFromDrop() {
    dropFinished = false;
    dropFinishedFrames = 0;
    dropFromDrop = true;
    skillTreeOpen = true;
    showToast("ÁRBOL DE HABILIDADES (T PARA CERRAR)");
}

function dropPlungerStartCharge() {
    if (!dropMachineActive || dropPlungerCharging) return;
    if (dropBallsRemaining <= 0) return;
    if (dropBalls.some(b => b.inLane)) return; // ya hay una bola en el canal
    dropPlungerCharging = true;
    dropPlungerPower = 0;
}

function dropPlungerRelease() {
    if (!dropPlungerCharging) return;
    dropPlungerCharging = false;
    launchDropBall(dropPlungerPower);
    dropPlungerPower = 0;
}

// TANDA 4: launchDropBall(power) lanza con el émbolo. power 0-100.
// La bola sale desde el resorte (x 480, y 232), sube por el canal derecho
// y al llegar arriba (y <= 58) entra al tablero con velocidad lateral
// según la potencia: más potencia = entra más rápido y más a la izquierda.
function launchDropBall(power) {
    if (dropBallsRemaining <= 0 || dropBalls.length >= 5) return;
    // TANDA 6: tope de bolas por sesion: aunque queden en el contador, no se
    // lanzan mas alla de 24 en total, asi la DROP siempre tiene final.
    if (dropBallsLaunched >= DROP_MAX_TOTAL_BALLS) { dropBallsRemaining = 0; return; }
    const p = Math.max(0, Math.min(100, typeof power === "number" ? power : 50));
    dropBalls.push({ x: 480, y: 232, vx: 0, vy: -(5 + p * 0.07), r: 5,
        inLane: true, power: p, bumperCooldown: 0 });
    dropBallsLaunched++;
    dropBallsRemaining--;
}

function resolveDropBall(ball) {
    // TANDA 3: la DROP MACHINE es para XP, no para puntos ni cartas.
    // Cada bola da 10 XP por cada x1 de multiplicador (x2=20, x3=30, x5=50).
    // Cada 100 XP = 1 punto de habilidad para el árbol permanente.
    const slots = [2, 3, 2, 5, 2, 3, 2];
    const index = Math.max(0, Math.min(6, Math.floor((ball.x - 160) / 42)));
    const multiplier = slots[index];
    const earnedXp = 10 * multiplier;
    dropTotalScore += earnedXp;
    dropResolved++;
    addSkillXp(earnedXp);
    // TANDA 6: las bolas extra se suman UNA sola vez al resolver la bola y
    // con tope de 12 extra por sesion. El contador nunca se resetea: cada
    // lanzamiento resta 1 y cada bola que cae solo suma su extra (una vez).
    const extra = Math.min(4, multiplier - 1);
    const extraGranted = Math.min(extra, Math.max(0, 12 - dropBonusBalls));
    dropBonusBalls += extraGranted;
    dropBallsRemaining = Math.min(30, dropBallsRemaining + extraGranted);
    showToast("x" + multiplier + "  +" + earnedXp + " XP  +" + extraGranted + " BOLAS");
}

function updateDropMachine() {
    dropFrame++;
    // Fila móvil de clavijas: se mueve de lado a lado despacio.
    dropPegShift = Math.sin(dropFrame / 45) * 18;
    DROP_BUMPERS.forEach(b => { if (b.flash > 0) b.flash--; });

    // Cargar el resorte mientras se mantiene presionado (~1 segundo a tope).
    if (dropPlungerCharging) dropPlungerPower = Math.min(100, dropPlungerPower + 1.6);

    dropBalls.forEach(ball => {
        if (ball.bumperCooldown > 0) ball.bumperCooldown--;
        if (ball.inLane) {
            // Sube por el canal derecho sin gravedad ni clavijas.
            ball.y += ball.vy;
            ball.x = 480;
            if (ball.y <= 58) {
                ball.inLane = false;
                ball.x = 478;
                ball.vx = -(1.2 + ball.power * 0.035) + (Math.random() - 0.5) * 0.3;
                ball.vy = 0.8;
            }
            return;
        }
        ball.vy += 0.13;
        ball.x += ball.vx;
        ball.y += ball.vy;
        // El tablero termina en x 460: el canal derecho (464-494) es solo subida.
        if (ball.x < 174 || ball.x > 460) {
            ball.x = Math.max(174, Math.min(460, ball.x));
            ball.vx *= -0.72;
        }
        // Bumpers de pinball: rebote fuerte + 5 XP por golpe, con enfriamiento
        // de 30 fotogramas por bola para no farmear infinito.
        DROP_BUMPERS.forEach(bumper => {
            const dx = ball.x - bumper.x, dy = ball.y - bumper.y;
            const distance = Math.hypot(dx, dy);
            if (distance < ball.r + bumper.r && distance > 0) {
                const nx = dx / distance, ny = dy / distance;
                ball.x = bumper.x + nx * (ball.r + bumper.r);
                ball.y = bumper.y + ny * (ball.r + bumper.r);
                const dot = ball.vx * nx + ball.vy * ny;
                ball.vx -= 1.9 * dot * nx;
                ball.vy -= 1.9 * dot * ny;
                ball.vx += nx * 2.2;
                ball.vy += ny * 2.2;
                const speed = Math.hypot(ball.vx, ball.vy);
                if (speed > 9) { ball.vx *= 9 / speed; ball.vy *= 9 / speed; }
                bumper.flash = 14;
                if (ball.bumperCooldown <= 0) {
                    ball.bumperCooldown = 30;
                    addSkillXp(5);
                    dropTotalScore += 5;
                    showToast("BUMPER +5 XP");
                    spawnParticles(bumper.x, bumper.y, 10,
                        ["#ffe16b", "#ffffff", "#ff8a35"], 3, 16, 3);
                }
            }
        });
        // Rebote sencillo en clavijas; la física se mantiene ligera para móviles.
        // La fila DROP_MOVING_ROW se desplaza con dropPegShift (igual que en el dibujo).
        for (let row = 0; row < 6; row++) {
            for (let col = 0; col < 7; col++) {
                const pegX = 195 + col * 42 + (row % 2) * 21 +
                    (row === DROP_MOVING_ROW ? dropPegShift : 0);
                const pegY = 105 + row * 27;
                const dx = ball.x - pegX, dy = ball.y - pegY;
                const distance = Math.hypot(dx, dy);
                if (distance < ball.r + 4 && distance > 0) {
                    const nx = dx / distance, ny = dy / distance;
                    ball.x = pegX + nx * (ball.r + 4);
                    ball.y = pegY + ny * (ball.r + 4);
                    const dot = ball.vx * nx + ball.vy * ny;
                    ball.vx -= 1.65 * dot * nx;
                    ball.vy -= 1.65 * dot * ny;
                    ball.vx += (Math.random() - 0.5) * 0.28;
                }
            }
        }
    });
    const landed = dropBalls.filter(ball => ball.y >= 240);
    landed.forEach(resolveDropBall);
    dropBalls = dropBalls.filter(ball => ball.y < 240);
}

function update() {
    if (skillTreeOpen) return; // el juego se pausa mientras ves el árbol
    if (choiceOpen || tradeOpen) return; // TANDA 5: pausa mientras eliges o comercias
    // TANDA 8: cinemática del jefe: todo pausado ~3 s, el jefe cae del cielo
    // y entra caminando; se salta con cualquier tecla o toque.
    if (bossCinematicFrames > 0) {
        bossCinematicFrames--;
        const b = bossCinematicEnemy;
        if (b && b.hp > 0) {
            if (b.y < floor - b.h) b.y = Math.min(floor - b.h, b.y + 7);
            else if (Math.abs(b.x - 9100) > 3) b.x += (9100 - b.x > 0 ? 1 : -1) * 3;
            if (b.y >= floor - b.h && bossCinematicFrames % 6 === 0) {
                spawnParticles(b.x + b.w / 2, floor - 4, 4, ["#8a8f93", "#ffe16b"], 1.6, 16, 3);
            }
            shakeFrames = 2;
        }
        if (bossCinematicFrames <= 0) bossCinematicEnemy = null;
        return;
    }
    if (missionComplete && dropMachineActive) {
        updateDropMachine();
        // TANDA 6: la DROP termina cuando no quedan bolas por lanzar ni en juego.
        if (dropBallsRemaining <= 0 && dropBalls.length === 0) finishDropMachine();
        return;
    }
    // TANDA 6: pantalla DROP TERMINADO unos segundos y luego se abre el arbol.
    if (missionComplete && dropFinished && !skillTreeOpen) {
        dropFinishedFrames--;
        if (dropFinishedFrames <= 0) openSkillTreeFromDrop();
        return;
    }
    if (gameOver || missionComplete) return;

    gameFrame++;

    updatePlayer();
    updateMythicAbility();
    updateMythicEffects();
    updateCamera();
    updateShooting();
    updateBullets();
    updateWaves();
    updateEnemies();
    updateEnemyBullets();
    updateChests();
    updatePickups();
    updateParticles();
    updateMission();
    updateEventVisuals();
    // TANDA 8: si el objetivo está fijado a mano, la retícula lo sigue
    // aunque no estés disparando; si murió o salió de rango, se libera.
    if (aimLocked) { clearAimLockIfInvalid(); if (aimLocked) aimTarget = aimLocked; }
}
