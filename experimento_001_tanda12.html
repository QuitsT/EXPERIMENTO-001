function drawSkyline() {
    if (currentMission === 2) {
        // TANDA 12: Fondo industrial con chimeneas, humo y siluetas de calderas
        ctx.fillStyle = "#1b1e23";
        ctx.fillRect(0, 0, W, H);
        const parallax = cameraX * 0.25;
        ctx.fillStyle = "#262b32";
        for (let i = 0; i < 14; i++) {
            const x = i * 200 - (parallax % 200);
            const height = 65 + (i % 5) * 16;
            ctx.fillRect(x, 230 - height, 85, height);
            ctx.fillRect(x + 15, 230 - height - 25, 14, 25);
            ctx.fillRect(x + 55, 230 - height - 15, 12, 15);
            ctx.fillStyle = "#ff793f";
            ctx.fillRect(x + 20, 245 - height, 10, 10);
            ctx.fillRect(x + 50, 245 - height, 10, 10);
            ctx.fillStyle = "#262b32";
        }
        ctx.fillStyle = "#2f3640";
        ctx.fillRect(0, 240, W, 60);
        return;
    }
    ctx.fillStyle = "#27313a";
    ctx.fillRect(0, 0, W, H);

    const parallax = cameraX * 0.25;

    ctx.fillStyle = "#303c43";

    for (let i = 0; i < 12; i++) {
        const x = i * 240 - (parallax % 240);
        const height = 50 + (i % 4) * 17;
        ctx.fillRect(x, 220 - height, 105, height);
        ctx.fillRect(x + 12, 230 - height, 12, 12);
        ctx.fillRect(x + 40, 230 - height, 12, 12);
    }

    ctx.fillStyle = "#354652";
    ctx.fillRect(0, 240, W, 60);
}

function drawWorldBuildings() {
    // TANDA 11: los edificios SON la ciudad: casas y negocios con letrero
    // y con su puerta a nivel de suelo. Los enemigos salen POR ESAS
    // PUERTAS (ver SPAWN_STRUCTURES): si alguien está a punto de salir,
    // la puerta brilla y muestra "!".
    SPAWN_STRUCTURES.forEach(b => {
        const x = b.x - cameraX;

        ctx.fillStyle = "#34424b";
        ctx.fillRect(x, b.y, b.w, b.h);

        ctx.fillStyle = "#53616a";
        ctx.fillRect(x - 5, b.y, b.w + 10, 9);

        ctx.fillStyle = "#1e2a31";
        for (let wx = 12; wx < b.w - 8; wx += 32) {
            ctx.fillRect(x + wx, b.y + 22, 16, 18);
        }

        ctx.fillStyle = "#222b31";
        ctx.fillRect(x + 8, b.y + b.h - 18, b.w - 16, 18);

        // Letrero del negocio y su puerta a nivel de suelo.
        ctx.fillStyle = "#ffe16b";
        ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
        ctx.fillText(b.name, x + b.w / 2, b.y - 6);
        ctx.textAlign = "left";
        const dx = b.door - cameraX;
        ctx.fillStyle = doorWarningActive(b.door) ? "#ffe16b" : "#1e2a31";
        ctx.fillRect(dx, floor - 34, 20, 34);
        ctx.fillStyle = "#53616a";
        ctx.fillRect(dx - 2, floor - 36, 24, 4);
        if (doorWarningActive(b.door)) {
            ctx.fillStyle = "#ffe16b"; ctx.font = "bold 14px monospace"; ctx.textAlign = "center";
            ctx.fillText("!", dx + 10, floor - 42); ctx.textAlign = "left";
        }
    });

    // Torres militares.
    [290, 900, 1550, 2150, 2900, 4900, 6900, 8900].forEach(xWorld => {
        const x = xWorld - cameraX;

        ctx.fillStyle = "#4c594b";
        ctx.fillRect(x, 145, 12, 95);

        ctx.fillStyle = "#68785b";
        ctx.fillRect(x - 12, 140, 36, 12);

        ctx.fillStyle = "#202b2d";
        ctx.fillRect(x - 3, 158, 18, 6);
    });
}

function drawBarricade(xWorld) {
    const x = xWorld - cameraX;

    ctx.fillStyle = "#776345";
    ctx.fillRect(x, 270, 45, 30);

    ctx.fillStyle = "#b0925c";
    ctx.fillRect(x + 4, 275, 37, 5);

// Rectángulos provisionales: se usan solo si los sprites no se pueden cargar.
function drawPlayerPlaceholder() {
    const px = player.x - cameraX;
    const py = player.y;
    const crouching = player.h === player.crouchH;

    ctx.fillStyle = "#42d9e8";
    ctx.fillRect(px, py, player.w, player.h);

    ctx.fillStyle = "#f1c27d";
    ctx.fillRect(px + 4, py - (crouching ? 5 : 8),
        14, crouching ? 8 : 10);

    ctx.fillStyle = "#222";

    if (keys.up) {
        ctx.fillRect(px + 9, py - 12, 4, 14);
    } else if (player.facing === 1) {
        ctx.fillRect(px + 16, py + (crouching ? 5 : 12), 15, 5);
    } else {
        ctx.fillRect(px - 9, py + (crouching ? 5 : 12), 15, 5);
    }
}

function drawCaptain() {
    const now = performance.now();
    const crouching = player.h === player.crouchH;
    const firing = isFiring();
    const walking = player.moving && player.grounded && !crouching;
    const landing = player.grounded && !crouching && !player.moving && !firing &&
                    now - player.landedAt < 120;

    // Estado de animación según lo que hace el Capitán en este momento.
    let state;

    if (gameOver) state = "death";
    else if (now < player.hurtUntil) state = "hurt";
    else if (!player.grounded || landing) state = "jump";
    else if (crouching) state = "crouch";
    else if (walking) state = "walk";
    else if (firing) state = "shoot";
    else state = "idle";

    if (state !== player.animState) {
        player.animState = state;
        player.animStart = now;
    }

    const frames = captainSprites[state];
    let index = Math.floor((now - player.animStart) / SPRITE_FRAME_MS[state]) % frames.length;

    if (state === "death") {
        index = Math.min(frames.length - 1,
            Math.floor((now - player.deadAt) / SPRITE_FRAME_MS.death));
    } else if (state === "hurt") {
        index = Math.min(frames.length - 1,
            Math.floor((now - (player.hurtUntil - HURT_MS)) / SPRITE_FRAME_MS.hurt));
    } else if (state === "crouch") {
        // Fotogramas 0-1: agachado en reposo. Fotogramas 2-3: agachado disparando.
        index = (firing ? 2 : 0) + (Math.floor(now / SPRITE_FRAME_MS.crouch) % 2);
    } else if (state === "jump") {
        // 0: impulso, 1: subiendo, 2: arriba/cayendo, 3: aterrizaje.
        if (player.grounded) index = 3;
        else if (player.vy < -7) index = 0;
        else if (player.vy < -2) index = 1;
        else index = 2;
    }

    const img = frames[index];
    const footX = Math.round(player.x - cameraX + player.w / 2);
    const footY = Math.round(gameOver ? player.groundY : player.y + player.h);

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(footX, footY);
    ctx.scale(player.facing, 1);
    ctx.drawImage(img, -Math.round(img.width / 2), -img.height);
    ctx.restore();

    // El arma se orienta verticalmente cuando se mantiene ↑. El destello
    // aparece en la boca del cañón al disparar, sin usar la antigua línea guía.
    if (keys.up && !gameOver) {
        const crouchOffset = crouching ? 7 : 0;
        ctx.fillStyle = "#252a2e";
        ctx.fillRect(footX - 2, footY - 38 + crouchOffset, 4, 10);
        ctx.fillStyle = "#aeb9bd";
        ctx.fillRect(footX - 1, footY - 40 + crouchOffset, 2, 4);
        if (isFiring()) {
            ctx.fillStyle = "#ffe16b";
            ctx.fillRect(footX - 3, footY - 45 + crouchOffset, 6, 4);
        }
    }
}

function drawPlayer() {
    // Parpadeo de invulnerabilidad (no mientras dura la animación de daño).
    if (!gameOver && player.invulnerable &&
        performance.now() >= player.hurtUntil &&
        Math.floor(Date.now() / 100) % 2 === 0) return;

    if (spritesReady) {
        drawCaptain();
    } else {
        drawPlayerPlaceholder();
    }
}

function drawEnemies() {
    const now = Date.now();

    enemies.forEach(enemy => {
        const ex = Math.round(enemy.x - cameraX);
        const ey = Math.round(enemy.y);
        const t = ENEMY_TYPES[enemy.type];
        const crouched = enemy.type === "gunner";
        const big = enemy.type === "heavy" || enemy.type === "boss" || enemy.type === "mayor";

        if (enemy.emerge > 0) ctx.globalAlpha = 1 - enemy.emerge / 40;

        // Cuerpo, casco y cara.
        ctx.fillStyle = t.color;
        ctx.fillRect(ex, ey, enemy.w, enemy.h);

        ctx.fillStyle = "#354b35";
        ctx.fillRect(ex + 3, ey - 7, enemy.w - 6, 9);

        ctx.fillStyle = "#d5a16d";
        ctx.fillRect(ex + 5, ey + 2, enemy.w - 10, 8);

        if (big) {
            ctx.fillStyle = "#8d6f3a";
            ctx.fillRect(ex - 3, ey + 6, 7, 10);
            ctx.fillRect(ex + enemy.w - 4, ey + 6, 7, 10);
        }

        // Arma.
        ctx.fillStyle = "#202020";
        const gunW = big ? 18 : 13;
        const gunH = big ? 7 : 5;
        const gunY = ey + (crouched ? 6 : big ? 16 : 12);

        ctx.fillRect(
            enemy.facing === 1 ? ex + enemy.w - 5 : ex - gunW + 5,
            gunY, gunW, gunH
        );

        // TANDA 5: marcas propias de cada enemigo especial.
        if (enemy.type === "scout") {
            ctx.fillStyle = "#e8fff8";
            ctx.fillRect(ex + enemy.w / 2 - 1, ey - 14, 2, 8);
            ctx.fillRect(ex + enemy.w / 2 - 3, ey - 16, 6, 3);
        } else if (enemy.type === "pyro") {
            // TANDA 12: lanzallamas con tanque trasero y boquilla
            ctx.fillStyle = "#8a3a00";
            ctx.fillRect(enemy.facing === 1 ? ex - 5 : ex + enemy.w, ey + 6, 5, 20);
            ctx.fillStyle = "#ff6a00";
            ctx.fillRect(enemy.facing === 1 ? ex + enemy.w + 5 : ex - 12, ey + 12, 7, 5);
        } else if (enemy.type === "mutant") {
            // TANDA 12: mutante con ojos brillantes químicos
            ctx.fillStyle = "#55efc4";
            ctx.fillRect(enemy.facing === 1 ? ex + enemy.w - 7 : ex + 2, ey + 4, 5, 4);
        } else if (enemy.type === "cryo_specimen") {
            // TANDA 12: espécimen criogénico con púas de hielo
            ctx.fillStyle = "#aed6f1";
            ctx.fillRect(ex + enemy.w / 2 - 8, ey - 10, 16, 4);
            ctx.fillRect(ex + enemy.w / 2 - 4, ey - 14, 8, 4);
            ctx.fillStyle = "#5dade2";
            ctx.fillRect(ex - 3, ey + 6, 4, 12);
            ctx.fillRect(ex + enemy.w - 1, ey + 6, 4, 12);
        } else if (enemy.type === "boss_m2") {
            // TANDA 12: Prototipo Berserker con núcleo de energía en el pecho
            ctx.fillStyle = enemy.enraged ? "#ff4757" : "#ffa502";
            ctx.beginPath();
            ctx.arc(ex + enemy.w / 2, ey + enemy.h / 2, 7, 0, Math.PI * 2);
            ctx.fill();
        } else if (enemy.type === "ratking") {
            // TANDA 10: corona dorada y cola de rata.
            ctx.fillStyle = "#ffe16b";
            ctx.fillRect(ex + enemy.w / 2 - 8, ey - 12, 16, 6);
            ctx.fillRect(ex + enemy.w / 2 - 8, ey - 16, 4, 5);
            ctx.fillRect(ex + enemy.w / 2 + 4, ey - 16, 4, 5);
            ctx.strokeStyle = "#c98a5a"; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(ex, ey + enemy.h - 6);
            ctx.quadraticCurveTo(ex - 16, ey + enemy.h + 4, ex - 24, ey + enemy.h - 8);
            ctx.stroke();
        } else if (enemy.type === "shield" || enemy.type === "mayor" || enemy.type === "titan_bot") {
            // TANDA 7: escudo roto = sin barra gris (borde amarillo); escudo a
            // punto de romperse (2 golpes) = barra naranja agrietada.
            const sx = enemy.facing === 1 ? ex + enemy.w : ex - 6;
            if (Date.now() < enemy.shieldBrokenUntil) {
                ctx.strokeStyle = "#ffe16b";
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, ey + 2, 6, enemy.h - 4);
            } else {
                ctx.fillStyle = (enemy.shieldHits || 0) >= 2 ? "#ff9a3a" : "#c8d4e0";
                ctx.fillRect(sx, ey + 2, 6, enemy.h - 4);
            }
        } else if (enemy.type === "trapper" && enemy.hidden) {
            ctx.fillStyle = "#1e1b2e";
            ctx.fillRect(ex - 2, ey + 14, enemy.w + 4, enemy.h - 12);
            ctx.fillStyle = "#b18cff";
            ctx.font = "bold 12px monospace";
            ctx.fillText("?", ex + enemy.w / 2 - 3, ey + 28);
        } else if (enemy.type === "drone") {
            ctx.fillStyle = "#ffd7f2";
            ctx.fillRect(ex - 4, ey - 6, enemy.w + 8, 2);
            ctx.beginPath();
            ctx.arc(ex + enemy.w / 2, ey + enemy.h / 2, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        if (t.label) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 9px monospace";
            ctx.textAlign = "center";
            ctx.fillText(t.label, ex + enemy.w / 2, ey - 19);
            ctx.textAlign = "left";
        }

        // Barra de vida.
        ctx.fillStyle = "#202020";
        ctx.fillRect(ex - 2, ey - 14, enemy.w + 4, 5);

        ctx.fillStyle = "#e34d4d";
        ctx.fillRect(ex - 2, ey - 14,
            (enemy.w + 4) * Math.max(0, enemy.hp / enemy.maxHp), 5);

                if (enemy.type === "boss") {
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 9px monospace";
            ctx.textAlign = "center";
            ctx.fillText("COMANDANTE EXPERIMENTAL", ex + enemy.w / 2, ey - 19);
            ctx.textAlign = "left";
        } else if (enemy.type === "boss_m2") {
            ctx.fillStyle = "#ffdd59";
            ctx.font = "bold 9px monospace";
            ctx.textAlign = "center";
            ctx.fillText("PROTOTIPO BERSERKER", ex + enemy.w / 2, ey - 19);
            ctx.textAlign = "left";
        }
        // TANDA 10 & 12: nombre del jefe de ruta sobre su barra de vida.
        if (enemy.type === "ratking" || enemy.type === "mayor" || enemy.type === "cryo_specimen" || enemy.type === "titan_bot") {
            ctx.fillStyle = "#ffe16b";
            ctx.font = "bold 9px monospace";
            ctx.textAlign = "center";
            let rTitle = enemy.type === "ratking" ? "REY RATA DEL SUBTERRÁNEO" :
                enemy.type === "mayor" ? "CENTINELA MAYOR" :
                enemy.type === "cryo_specimen" ? "ESPÉCIMEN CRIOGÉNICO" : "TITÁN INDUSTRIAL";
            ctx.fillText(rTitle, ex + enemy.w / 2, ey - 19);
            ctx.textAlign = "left";
        }

        if (enemy.flash > 0) {
            ctx.fillStyle = "#ffffffaa";
            ctx.fillRect(ex, ey - 7, enemy.w, enemy.h + 7);
        }

        ctx.globalAlpha = 1;

        // Aviso: el enemigo está a punto de disparar.
        if (enemy.emerge <= 0 && enemy.burstLeft === 0 && enemy.nextShot - now < 380) {
            ctx.fillStyle = "#ffdd44";
            ctx.fillRect(ex + enemy.w / 2 - 1, ey - 27, 3, 7);
            ctx.fillRect(ex + enemy.w / 2 - 1, ey - 18, 3, 3);
        }
    });
}

function drawChests() {
    chests.forEach(c => {
        const x = Math.round(c.x - cameraX);
        const y = Math.round(c.y);

        if (x < -50 || x > W + 50) return;

        // Base del cofre.
        ctx.fillStyle = "#4a5560";
        ctx.fillRect(x, y + 8, c.w, c.h - 8);

        ctx.fillStyle = "#2d363e";
        ctx.fillRect(x, y + 8, c.w, 3);
        ctx.fillRect(x + 4, y + 8, 3, c.h - 8);
        ctx.fillRect(x + c.w - 7, y + 8, 3, c.h - 8);

        if (c.open) {
            // Tapa levantada y brillo.
            ctx.fillStyle = "#5d6a76";
            ctx.fillRect(x - 2, y - 6, c.w + 4, 5);
            ctx.fillStyle = "#7ff3ff55";
            ctx.fillRect(x + 3, y + 2, c.w - 6, 7);
        } else {
            ctx.fillStyle = "#5d6a76";
            ctx.fillRect(x - 1, y, c.w + 2, 9);
            ctx.fillStyle = "#42d9e8";
            ctx.fillRect(x + c.w / 2 - 3, y + 5, 6, 6);
        }
    });
}

function drawCardIcon(x, y, w, h, color, rarity) {
    const rarityColor = rarity && CARD_RARITIES[rarity]
        ? CARD_RARITIES[rarity].color : "#10151b";
    ctx.fillStyle = rarityColor;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = "#10151b";
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#ffffffcc";
    ctx.fillRect(x + Math.floor(w / 2) - 1, y + Math.floor(h / 2) - 2, 3, 4);
}

function drawPickups() {
    pickups.forEach(p => {
        const x = Math.round(p.x - cameraX);
        const y = Math.round(p.y);

        if (x < -30 || x > W + 30) return;

        // Las cartas soltadas parpadean cuando están por desaparecer.
        if (p.kind === "card" && p.life < 90 && Math.floor(p.life / 6) % 2 === 0) return;

        if (p.kind === "weapon") {
            const wp = WEAPONS[p.weapon];
            const bob = Math.round(Math.sin(gameFrame / 10) * 2);

            ctx.fillStyle = "#10151b";
            ctx.fillRect(x - 1, y - 1 + bob, p.w + 2, p.h + 2);
            ctx.fillStyle = wp.color;
            ctx.fillRect(x, y + bob, p.w, p.h);
            ctx.fillStyle = "#10151b";
            ctx.font = "bold 12px monospace";
            ctx.textAlign = "center";
            ctx.fillText(wp.letter, x + p.w / 2, y + 12 + bob);
            ctx.textAlign = "left";
        } else if (p.kind === "mythic") {
            const mythic = MYTHIC_CARDS.find(item => item.id === p.mythicId);
            ctx.fillStyle = "#fff4bd";
            ctx.fillRect(x - 2, y - 2, p.w + 4, p.h + 4);
            ctx.fillStyle = mythic ? mythic.color : "#d78cff";
            ctx.fillRect(x, y, p.w, p.h);
            ctx.fillStyle = "#17121d";
            ctx.font = "bold 13px monospace";
            ctx.textAlign = "center";
            ctx.fillText("M", x + p.w / 2, y + 15);
            ctx.textAlign = "left";
        } else {
            drawCardIcon(x, y, p.w, p.h, p.card.color, p.card.rarity);
        }
    });
}

function drawBullets() {
    bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(Math.round(b.x - cameraX), Math.round(b.y), b.w, b.h);
    });

    ctx.fillStyle = "#ff6347";

    enemyBullets.forEach(b => {
        ctx.fillRect(Math.round(b.x - cameraX), Math.round(b.y), b.w, b.h);
    });
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = Math.min(1, p.life / (p.max * 0.5));
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x - cameraX), Math.round(p.y), p.size, p.size);
    });

    ctx.globalAlpha = 1;
}

    ctx.fillStyle = "#7ff3ff";

    ctx.fillText("XP " + skillXp + "/" + SKILL_XP_PER_POINT + "  ·  PUNTOS: " + skillPoints +
        "  ·  ÁRBOL: " + skillLevels.reduce((a, b) => a + b, 0) + "/30  (T / HAB)", 15, 206);
    ctx.fillStyle = "#ffffff";

    // Arma actual y munición.
    const wp = WEAPONS[player.weapon];
    ctx.font = "12px monospace";
    ctx.fillStyle = wp.color;
    let ammoLabel = "";
    if (player.weapon !== "pistol") {
        ammoLabel = "  " + player.magazine + "/" + player.reserveAmmo;
        if (player.reloadUntil > Date.now()) ammoLabel += "  RECARGANDO";
    }
    ctx.fillText("ARMA: " + wp.name + ammoLabel, 15, 109);

    // Inventario compacto: seis familias, acumulaciones y rarezas visibles.
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px monospace";
    ctx.fillText("CARTAS " + cards.length + "/48", 15, 128);
    CARD_TYPES.forEach((type, i) => {
        const count = countCardType(type.id);
        const x = 16 + i * 24;
        drawCardIcon(x, 134, 13, 17, type.color);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px monospace";
        ctx.fillText(String(count), x + 15, 147);
    });
    const rarityCounts = Object.keys(CARD_RARITIES).map(key =>
        cards.filter(card => card.rarity === key).length);
    ctx.font = "9px monospace";
    ctx.fillStyle = "#cbd5dc";
    ctx.fillText("C " + rarityCounts[0] + "  R " + rarityCounts[1] +
        "  E " + rarityCounts[2] + "  L " + rarityCounts[3], 15, 164);
    if (activeCombos.length) {
        ctx.fillStyle = "#ffe16b";
        ctx.font = "bold 9px monospace";
        ctx.fillText("COMBOS: " + activeCombos.map(id =>
            CARD_COMBOS.find(c => c.id === id)?.name || id).join(" / "), 15, 178);
    }
    const selectedMythic = mythicInventory.length
        ? MYTHIC_CARDS.find(item => item.id === mythicInventory[activeMythicIndex]) : null;
    ctx.font = "bold 9px monospace";
    ctx.fillStyle = selectedMythic ? selectedMythic.color : "#aeb8c2";
    const abilityState = mythicActiveId ? "ACTIVO" :
        Date.now() < mythicCooldownUntil ? "RECARGA" : "LISTO";
    ctx.fillText("MÍTICA: " + (selectedMythic ? selectedMythic.name : "NINGUNA") +
        " [" + abilityState + "]  E · ★ (tocar=usar, mantener=cambiar)", 15, 191);
    // TANDA 7: estado de la esquiva (enfoque: esquivar, no apuntar).
    const dodgeReady = Date.now() >= player.dodgeCooldownUntil;
    ctx.fillStyle = dodgeReady ? "#7ff3ff" : "#8fa0ab";
    ctx.font = "bold 9px monospace";
    ctx.fillText("ESQUIVA: " + (dodgeReady ? "LISTA (ESQ / C)" :
        Math.ceil((player.dodgeCooldownUntil - Date.now()) / 1000) + " s"), 15, 220);

    // Barra de progreso del escenario.
    const progress = Math.min(1, player.x / END_X);

    ctx.fillStyle = "#172128";
    ctx.fillRect(180, 13, 270, 12);

    ctx.fillStyle = "#42d9e8";
    ctx.fillRect(180, 13, 270 * progress, 12);

    ctx.strokeStyle = "#b9c8d0";
    ctx.strokeRect(180, 13, 270, 12);

    ctx.fillStyle = "white";
    ctx.font = "10px monospace";
    ctx.fillText("AVANCE DE MISION", 250, 39);

    ctx.font = "13px monospace";
    ctx.fillText("ZONA " + String(currentZone + 1).padStart(2, "0"), 500, 25);
    // TANDA 5: cronometro de mision.
    ctx.fillStyle = "#f1d77b";
    ctx.font = "bold 13px monospace";
    ctx.fillText("TIEMPO " + formatMissionTime(), 500, 45);
    ctx.fillStyle = "#ffffff";
    if (chosenRoute) {
        ctx.font = "bold 10px monospace";
        ctx.fillText("RUTA " + chosenRoute + (routeMap === "underground" ? " · SUBTERRÁNEO" : routeMap === "surface" ? " · SUPERFICIE" : ""), 500, 62);
    }
    // TANDA 9: aviso de puerta de oleada con CUÁNTOS QUEDAN y una flecha
    // en el borde de la pantalla hacia el enemigo que falta (con su
    // distancia), para que nunca te quedes sin saber qué falta por matar.
    if (activeGateX() !== null) {
        const remaining = gateRemainingEnemies();
        ctx.fillStyle = "#ff8080";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.fillText("ELIMINA A TODOS PARA AVANZAR · QUEDAN: " + gateRemainingCount(), 320, 100);
        ctx.textAlign = "left";
        const gTarget = remaining[0] || null;
        if (gTarget) {
            const tx = gTarget.x - cameraX;
            if (tx < -10 || tx > W + 10) {
                const gLeft = tx < 0;
                const ax = gLeft ? 18 : W - 18;
                const ay = Math.max(70, Math.min(300, gTarget.y + gTarget.h / 2));
                const gDist = Math.round(Math.abs((gTarget.x + gTarget.w / 2) - (player.x + player.w / 2)));
                ctx.fillStyle = "#ffe16b";
                ctx.beginPath();
                if (gLeft) { ctx.moveTo(ax + 8, ay); ctx.lineTo(ax - 8, ay - 9); ctx.lineTo(ax - 8, ay + 9); }
                else { ctx.moveTo(ax - 8, ay); ctx.lineTo(ax + 8, ay - 9); ctx.lineTo(ax + 8, ay + 9); }
                ctx.closePath(); ctx.fill();
                ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
                ctx.fillText(enemyLabel(gTarget) + " · " + gDist + "px", gLeft ? 78 : W - 78, ay + 22);
                ctx.textAlign = "left";
            }
        }
    }
    // TANDA 8: objetivo actual del auto-apuntado (FIJO si lo elegiste a mano).
    if (aimTarget && aimTarget.hp > 0 && !gameOver && !missionComplete) {
        const manualAim = aimLockedManual && aimTarget === aimLocked;
        ctx.fillStyle = manualAim ? "#ff9a3d" : "#ffe16b";
        ctx.font = "bold 9px monospace";
        ctx.fillText("OBJETIVO: " + enemyLabel(aimTarget) +
            (manualAim ? " [FIJO · OBJ/TAB]" : " [AUTO · OBJ/TAB]"), 15, 233);
    }
    // TANDA 8: pista durante el apagón: avanzar o aguantar.
    if (blackoutFrames > 0) {
        ctx.fillStyle = "#ffe16b";
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        ctx.fillText("APAGÓN: NO TE VEN DE LEJOS · AVANZA CON CUIDADO O AGÁCHATE", 320, 115);
        ctx.textAlign = "left";
    }
    // TANDA 6: aviso de la Casa de Cambio (el boton COMERCIAR es el de la pantalla tactil).
    if (isNearTradeHouse() && !tradeOpen) {
        const pulse = 0.65 + 0.35 * Math.sin(gameFrame / 12);
        ctx.fillStyle = "rgba(255,225,107," + pulse.toFixed(2) + ")";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.fillText("▼  E: COMERCIAR  ·  O TOCA EL BOTÓN COMERCIAR  ▼", 320, 292);
        ctx.textAlign = "left";
    }
    // TANDA 6: dialogo de El Capitan en BANNER INFERIOR (nunca tapa el centro
    // de la pantalla), se oculta solo a los ~4 s y solo se muestra una vez.
    if (Date.now() < dialogueUntil && dialogueLines.length) {
        ctx.fillStyle = "rgba(0,0,0,0.72)";
        ctx.fillRect(10, 306, 620, 16 + dialogueLines.length * 13);
        ctx.fillStyle = "#f4d47a";
        ctx.font = "10px monospace";
        dialogueLines.forEach((line, i) => ctx.fillText(line, 18, 320 + i * 13));
    }

    // Aviso de depuración si falló la carga de los sprites.
    if (spritesFailed) {
        ctx.fillStyle = "#ff8080";
        ctx.font = "10px monospace";
        ctx.fillText("ERROR AL CARGAR SPRITES DEL CAPITAN", 15, 165);
    }

    if (Date.now() < zoneMessageUntil) {
        ctx.fillStyle = "#000000bb";
        ctx.fillRect(150, 115, 340, 38);

        ctx.fillStyle = "#f4d47a";
        ctx.font = "bold 16px monospace";
        ctx.textAlign = "center";
        ctx.fillText(zoneMessage, 320, 140);
        ctx.textAlign = "left";
    }

    if (Date.now() < toastUntil) {
        ctx.font = "bold 13px monospace";
        const tw = ctx.measureText(toastText).width + 20;

        ctx.fillStyle = "#000000bb";
        ctx.fillRect(320 - tw / 2, 165, tw, 24);

        ctx.fillStyle = "#7ff3ff";
        ctx.textAlign = "center";
        ctx.fillText(toastText, 320, 182);
        ctx.textAlign = "left";
    }
}

function drawDropMachine() {
    ctx.fillStyle = "#090d13";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#293b4a";
    ctx.fillRect(145, 28, 350, 260);
    ctx.strokeStyle = "#8fd9ef";
    ctx.lineWidth = 3;
    ctx.strokeRect(145, 28, 350, 260);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px monospace";
    ctx.textAlign = "center";
    ctx.fillText("DROP MACHINE", 320, 22);
    ctx.font = "12px monospace";
    ctx.fillText("BOLAS: " + dropBallsRemaining + "   XP GANADO: " + dropTotalScore + "   PUNTOS: " + skillPoints, 320, 48);

    // Canal derecho del émbolo (subida de la bola, separado del tablero).
    ctx.fillStyle = "#0d141b";
    ctx.fillRect(464, 32, 30, 254);
    ctx.strokeStyle = "#8fd9ef";
    ctx.lineWidth = 2;
    ctx.strokeRect(464, 32, 30, 254);
    ctx.fillStyle = "#8fd9ef";
    ctx.font = "bold 9px monospace";
    ctx.fillText("RESORTE", 479, 300 - 14);

    // Clavijas de la máquina (misma posición que en la física: 105 + fila*27).
    // La fila 3 (índice 2) se mueve de lado a lado: se dibuja en otro color.
    for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 7; col++) {
            const px = 195 + col * 42 + (row % 2) * 21 +
                (row === DROP_MOVING_ROW ? dropPegShift : 0);
            const py = 105 + row * 27;
            ctx.fillStyle = row === DROP_MOVING_ROW ? "#ffe16b" : "#b9d8e6";
            ctx.fillRect(px - 3, py - 3, 6, 6);
        }
    }
    // Bumpers de pinball con luz al golpear.
    DROP_BUMPERS.forEach(bumper => {
        ctx.fillStyle = bumper.flash > 0 ? "#ffe16b" : "#e34d4d";
        ctx.beginPath();
        ctx.arc(bumper.x, bumper.y, bumper.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(bumper.x, bumper.y, bumper.flash > 0 ? 6 : 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 8px monospace";
        ctx.fillText("+5", bumper.x, bumper.y + 18);
    });
    const slots = [2, 3, 2, 5, 2, 3, 2];
    slots.forEach((mult, i) => {
        const x = 160 + i * 42;
        ctx.fillStyle = mult === 5 ? "#a94c34" : mult === 3 ? "#276e8c" : "#344b59";
        ctx.fillRect(x, 245, 40, 25);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px monospace";
        ctx.fillText("x" + mult, x + 20, 263);
    });
    // Resorte / émbolo: se comprime con la potencia de carga.
    const springTop = 246 - dropPlungerPower * 0.12;
    ctx.strokeStyle = "#cbd5dc";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let sy = 272; sy >= springTop; sy -= 6) {
        const sx = (sy % 12 === 0) ? 472 : 488;
        if (sy === 272) ctx.moveTo(480, sy);
        else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    // Pelota lista en el resorte (cuando quedan bolas y no hay una en el canal).
    if (dropBallsRemaining > 0 && !dropBalls.some(b => b.inLane)) {
        ctx.fillStyle = "#ffe16b";
        ctx.beginPath();
        ctx.arc(480, springTop - 6, 5, 0, Math.PI * 2);
        ctx.fill();
    }
    // Barra de potencia del resorte.
    ctx.fillStyle = "#172128";
    ctx.fillRect(505, 80, 12, 140);
    ctx.fillStyle = dropPlungerPower > 66 ? "#e34d4d" : dropPlungerPower > 33 ? "#ffe16b" : "#4dc46a";
    ctx.fillRect(505, 220 - dropPlungerPower * 1.4, 12, dropPlungerPower * 1.4);
    ctx.strokeStyle = "#b9c8d0";
    ctx.lineWidth = 1;
    ctx.strokeRect(505, 80, 12, 140);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 9px monospace";
    ctx.fillText("POTENCIA", 511, 72);
    ctx.fillText(Math.round(dropPlungerPower) + "%", 511, 236);
    dropBalls.forEach(ball => {
        ctx.fillStyle = "#ffe16b";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.fillStyle = "#ffffff";
    ctx.font = "11px monospace";
    if (dropBallsRemaining > 0) {
        ctx.fillText("MANTÉN EL RESORTE (DERECHA) O ESPACIO PARA CARGAR · SUELTA PARA LANZAR", 320, 284);
    } else if (dropBalls.length > 0) {
        ctx.fillText("¡LAS ÚLTIMAS BOLAS ESTÁN EN JUEGO!", 320, 284);
    } else {
        ctx.fillStyle = "#ffe16b";
        ctx.font = "bold 13px monospace";
        ctx.fillText("RONDA TERMINADA · +" + dropTotalScore + " XP", 320, 284);
        ctx.fillStyle = "#ffffff";
        ctx.font = "10px monospace";
        ctx.fillText("TOCA PARA VER EL ÁRBOL DE HABILIDADES", 320, 273);
    }
    ctx.textAlign = "left";
}

function skillNodeX(i) { return 90 + i * 88; } // 90, 178, 266, 354, 442, 530
function skillNodeY(lv) { return 256 - lv * 36; } // nivel I abajo (256) ... V arriba (112)
// TANDA 6: el arbol ES un arbol: tronco abajo, 6 ramas que se abren y cada
// rama es una columna vertical de 5 nodos (I-V) unidos por lineas.
function drawSkillTree() {
    ctx.fillStyle = "#000000d8";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#10151b";
    ctx.fillRect(40, 18, 560, 324);
    ctx.strokeStyle = "#7ff3ff";
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 18, 560, 324);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.textAlign = "center";
    ctx.fillText("ÁRBOL DE HABILIDADES", 320, 44);
    ctx.font = "11px monospace";
    ctx.fillStyle = "#7ff3ff";
    if (dropFromDrop) {
        ctx.fillText("DROP TERMINADO  ·  +" + dropTotalScore + " XP  ·  PUNTOS: " + skillPoints, 320, 62);
    } else {
        ctx.fillText("PERMANENTE: no se pierde al morir ni al reiniciar  ·  XP " + skillXp + "/" +
            SKILL_XP_PER_POINT + "  ·  PUNTOS: " + skillPoints, 320, 62);
    }
    ctx.fillStyle = "#cbd5dc";
    ctx.font = "10px monospace";
    ctx.fillText("Toca un nodo o pulsa 1-6 para comprar el siguiente nivel  ·  T / HAB para cerrar", 320, 78);
    const romans = ["I", "II", "III", "IV", "V"];
    const shortDesc = ["+8% daño", "+7% cadencia", "+120 ms prot.", "+6% velocidad", "+4% crítico", "+8% munición"];
    // Tronco y suelo.
    ctx.fillStyle = "#6b4a2b";
    ctx.fillRect(312, 292, 16, 24);
    ctx.fillStyle = "#4c594b";
    ctx.fillRect(280, 316, 80, 6);
    SKILL_BRANCHES.forEach((branch, i) => {
        const x = skillNodeX(i);
        const level = skillLevels[i];
        const cost = skillLevelCost(i);
        // Rama: diagonal desde el tronco y tallo vertical con los 5 nodos.
        ctx.strokeStyle = branch.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(320, 304);
        ctx.lineTo(x, 292);
        ctx.lineTo(x, skillNodeY(4));
        ctx.stroke();
        // Nombre de la rama arriba de su columna.
        ctx.fillStyle = branch.color;
        ctx.font = "bold 10px monospace";
        ctx.textAlign = "center";
        ctx.fillText(branch.name, x, 96);
        for (let lv = 0; lv < 5; lv++) {
            const y = skillNodeY(lv);
            const bought = lv < level;
            const next = lv === level;
            ctx.beginPath();
            ctx.arc(x, y, next ? 15 : 13, 0, Math.PI * 2);
            ctx.fillStyle = bought ? branch.color : "#2a343c";
            ctx.fill();
            ctx.lineWidth = next ? 3 : 2;
            ctx.strokeStyle = next ? "#ffe16b" : (bought ? "#ffffff" : "#5a6a75");
            ctx.stroke();
            ctx.fillStyle = bought ? "#10151b" : "#8fa0ab";
            ctx.font = "bold 9px monospace";
            ctx.textAlign = "center";
            ctx.fillText(romans[lv], x, y + 3);
            // Coste del siguiente nivel, a la derecha del nodo que toca comprar.
            if (next && cost !== null) {
                ctx.fillStyle = skillPoints >= cost ? "#4dc46a" : "#8fa0ab";
                ctx.font = "bold 9px monospace";
                ctx.textAlign = "left";
                ctx.fillText(cost + " PT", x + 20, y + 3);
            }
            if (lv === 4 && level >= 5) {
                ctx.fillStyle = "#ffe16b";
                ctx.font = "bold 9px monospace";
                ctx.textAlign = "left";
                ctx.fillText("MÁX", x + 20, y + 3);
            }
        }
        // Efecto de la rama, bajo el tronco.
        ctx.fillStyle = "#cbd5dc";
        ctx.font = "8px monospace";
        ctx.textAlign = "center";
        ctx.fillText(shortDesc[i], x, 336);
    });
    ctx.textAlign = "left";
}

        ctx.font = "bold 12px monospace";
        ctx.fillText("TIEMPO DE MISIÓN: " + (missionFinalTime || "--:--") +
            "  ·  RUTA " + (chosenRoute || "B"), 320, 305);
    }

    if (missionComplete) {
        ctx.fillStyle = "#f1d77b";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.fillText(missionEndingLine, 320, 322);
        ctx.textAlign = "left";
        drawButton(75, "DROP MACHINE");
        if (currentMission === 1) {
            drawButton(220, "MISIÓN 2 ▶");
            drawButton(365, "REPETIR M1");
        } else {
            drawButton(220, "REPETIR M2");
            drawButton(365, "VOLVER A M1");
        }
    } else if (gameOver && checkpointIndex > 0) {
        // Con punto de control: continuar (conserva cartas normales) o reiniciar.
        drawButton(110, "CONTINUAR");
        drawButton(330, "REINICIAR");
    } else {
        drawButton(220, "REINTENTAR");
    }

    ctx.textAlign = "left";
}

// TANDA 7: retícula sobre el objetivo del auto-apuntado.
function drawAimReticle() {
    if (!aimTarget || aimTarget.hp <= 0 || gameOver || missionComplete) return;
    const manualAim = aimLockedManual && aimTarget === aimLocked;
    const ex = aimTarget.x - cameraX + aimTarget.w / 2;
    const ey = aimTarget.y + aimTarget.h / 2;
    // TANDA 8: retícula naranja y más gruesa si el objetivo es FIJO a mano;
    // amarilla si es el automático.
    ctx.strokeStyle = manualAim ? "#ff9a3d" : "#ffe16b";
    ctx.lineWidth = manualAim ? 3 : 2;
    ctx.beginPath();
    ctx.arc(ex, ey, 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex - 16, ey); ctx.lineTo(ex - 8, ey);
    ctx.moveTo(ex + 8, ey); ctx.lineTo(ex + 16, ey);
    ctx.moveTo(ex, ey - 16); ctx.lineTo(ex, ey - 8);
    ctx.moveTo(ex, ey + 8); ctx.lineTo(ex, ey + 16);
    ctx.stroke();
    if (manualAim) {
        ctx.fillStyle = "#ff9a3d";
        ctx.beginPath();
        ctx.moveTo(ex, ey - 27); ctx.lineTo(ex + 6, ey - 19); ctx.lineTo(ex - 6, ey - 19);
        ctx.closePath(); ctx.fill();
        ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
        ctx.fillText("FIJO", ex, ey - 30); ctx.textAlign = "left";
    }
}

function draw() {
    // TANDA 6: el boton COMERCIAR solo aparece cerca de la Casa de Cambio.
    updateTradeButton();
    updateDodgeButton();
    ctx.fillStyle = "#27313a";
    ctx.fillRect(0, 0, W, H);

    ctx.save();

    if (shakeFrames > 0) {
        ctx.translate(Math.round((Math.random() - 0.5) * 6),
                      Math.round((Math.random() - 0.5) * 6));
    }

    drawBackground();
    drawChests();
    drawPlatforms();
    drawEventVisuals();
    drawSpawnWarnings();
    drawPickups();
    drawEnemies();
    drawBullets();
    drawAimReticle();
    drawPlayer();
    drawParticles();

    ctx.restore();

    // TANDA 8: apagón de verdad: todo oscuro salvo un círculo de linterna
    // alrededor del Capitán (las luces parpadean).
    if (blackoutFrames > 0) {
        const px = player.x - cameraX + player.w / 2;
        const py = player.y + player.h / 2;
        ctx.fillStyle = "rgba(0,0,0," + (0.5 + Math.random() * 0.15) + ")";
        ctx.fillRect(0, 0, W, H);
        const glow = ctx.createRadialGradient(px, py, 20, px, py, 150);
        glow.addColorStop(0, "rgba(255,240,180,0.30)");
        glow.addColorStop(1, "rgba(255,240,180,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(px - 150, py - 150, 300, 300);
    }
    // TANDA 10: fundido a negro al bajar al subterráneo (entra y sale).
    if (tunnelFxFrames > 0) {
        const a = tunnelFxFrames > 22 ? (45 - tunnelFxFrames) / 23 : tunnelFxFrames / 22;
        ctx.fillStyle = "rgba(0,0,0," + Math.max(0, Math.min(0.9, a)).toFixed(2) + ")";
        ctx.fillRect(0, 0, W, H);
        if (tunnelFxFrames > 22) {
            ctx.fillStyle = "#ffe16b"; ctx.font = "bold 16px monospace"; ctx.textAlign = "center";
            ctx.fillText("SUBTERRÁNEO", 320, 180);
            ctx.textAlign = "left";
        }
    }
    // TANDA 8: alarma: bordes rojos parpadeando.
    if (alarmFxFrames > 0) {
        const a = 0.25 + 0.25 * Math.sin(alarmFxFrames / 4);
        ctx.fillStyle = "rgba(255,40,40," + a.toFixed(2) + ")";
        ctx.fillRect(0, 0, W, 10); ctx.fillRect(0, H - 10, W, 10);
        ctx.fillRect(0, 0, 10, H); ctx.fillRect(W - 10, 0, 10, H);
    }
    // TANDA 8: tarjeta del jefe durante su cinemática.
    if (bossCinematicFrames > 0) drawBossIntro();

    drawUI();

    if (choiceOpen && choiceData) drawChoiceMenu();
    if (tradeOpen) drawTradeMenu();

    if (skillTreeOpen) { drawSkillTree(); return; }

    if (gameOver && performance.now() - player.deadAt > DEATH_SCREEN_DELAY) {
        drawEndScreen("EXPERIMENTO FALLIDO", "MISION INTERRUMPIDA");
    }

    if (missionComplete) {
        if (dropMachineActive) drawDropMachine();
        else if (dropFinished) drawDropFinished();
        else drawEndScreen("MISION COMPLETADA",
            "RUTA " + (chosenRoute || "B") + (routeMap === "underground" ? " · SUBTERRÁNEO" : routeMap === "surface" ? " · SUPERFICIE" : "") + "  ·  TIEMPO " + (missionFinalTime || "--:--"));
    }
}

canvas.addEventListener("pointerdown", e => {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) / rect.width * W;
    const cy = (e.clientY - rect.top) / rect.height * H;

    // TANDA 6: tocar descarta el dialogo inferior (ademas de su accion normal).
    if (dialogueUntil > Date.now()) dialogueUntil = 0;
    if (!dropMachineActive && !skillTreeOpen && cy >= 8 && cy <= 30) {
        if (cx >= 172 && cx <= 204) {
            if (currentMission !== 1) switchMission(1);
            return;
        } else if (cx >= 206 && cx <= 238) {
            if (currentMission !== 2) switchMission(2);
            return;
        }
    }

    // TANDA 8: un toque salta la cinemática del jefe.
    if (bossCinematicFrames > 0) { endBossCinematic(); return; }

    // TANDA 5: toques en los menus de decision y comercio.
    if (choiceOpen && choiceData) {
        if (cy >= 150 && cy <= 200) { applyChoice(1); return; }
        if (cy >= 210 && cy <= 260) { applyChoice(2); return; }
        return;
    }
    if (tradeOpen) {
        if (cx >= 470 && cx <= 554 && cy >= 296 && cy <= 320) { closeTrade(); return; }
        if (tradeStep === "menu") {
            if (cy >= 100 && cy <= 136) { tradeAction = 1; tradeStep = "familia"; return; }
            if (cy >= 144 && cy <= 180) { tradeAction = 2; tradeStep = "familia"; return; }
            if (cy >= 188 && cy <= 224) { tradeAction = 3; tradeStep = "familia"; return; }
        } else {
            for (let i = 0; i < 6; i++) {
                if (cy >= 112 + i * 26 && cy <= 134 + i * 26) { tradePickFamily(i + 1); return; }
            }
        }
        return;
    }
    // TANDA 9: tocar la caja YA NO la agarra: se abre agachándose junto
    // a ella (ver updateEventVisuals). El toque pasa al resto de acciones.
    // TANDA 8: tocar un enemigo lo fija como objetivo del auto-apuntado.
    if (!gameOver && !missionComplete && !skillTreeOpen && !choiceOpen && !tradeOpen && !dropMachineActive) {
        let tapped = null, tappedDist = Infinity;
        enemies.forEach(enemy => {
            if (enemy.hp <= 0 || enemy.hidden || enemy.emerge > 0) return;
            const ex = enemy.x - cameraX, ey = enemy.y;
            if (cx >= ex - 4 && cx <= ex + enemy.w + 4 && cy >= ey - 4 && cy <= ey + enemy.h + 4) {
                const d = Math.hypot(cx - (ex + enemy.w / 2), cy - (ey + enemy.h / 2));
                if (d < tappedDist) { tappedDist = d; tapped = enemy; }
            }
        });
        if (tapped) {
            if (aimInRange(tapped)) { lockAimTarget(tapped); showToast("OBJETIVO: " + enemyLabel(tapped)); }
            else showToast("OBJETIVO FUERA DE ALCANCE");
            return;
        }
    }
    // TANDA 5: tocar la Casa de Cambio (o su letrero) abre el comercio.
    if (!gameOver && !missionComplete && isNearTradeHouse() && cx >= TRADE_X - cameraX - 10 && cx <= TRADE_X - cameraX + 120 &&
        cy >= 150 && cy <= 300) { openTrade(); return; }

    if (skillTreeOpen) {
        // TANDA 6: el arbol es un arbol de verdad: toca un nodo para comprar
        // ese nivel (en orden I -> V); tocar fuera de los nodos no compra nada.
        for (let i = 0; i < 6; i++) {
            for (let lv = 0; lv < 5; lv++) {
                const nx = skillNodeX(i), ny = skillNodeY(lv);
                if (Math.abs(cx - nx) <= 18 && Math.abs(cy - ny) <= 18) {
                    if (lv < skillLevels[i]) showToast("NIVEL YA COMPRADO");
                    else if (lv > skillLevels[i]) showToast("COMPRA PRIMERO EL NIVEL ANTERIOR");
                    else buySkillLevel(i);
                    return;
                }
            }
        }
        return;
    }

    if (gameOver && performance.now() - player.deadAt > DEATH_SCREEN_DELAY) {
        if (checkpointIndex > 0 && cx < W / 2) continueFromCheckpoint();
        else restartGame();
    } else if (missionComplete && dropMachineActive) {
        // TANDA 6: si ya no quedan bolas, el toque termina la DROP (no reinicia el juego).
        if (dropBallsRemaining <= 0 && dropBalls.length === 0) finishDropMachine();
        else if (cx >= 455) dropPlungerStartCharge();
    } else if (missionComplete && dropFinished) {
        // TANDA 6: tocar en la pantalla DROP TERMINADO abre el arbol ya.
        openSkillTreeFromDrop();
        } else if (missionComplete) {
        if (cy >= 245 && cy <= 300) {
            if (cx < 200) {
                startDropMachine();
            } else if (cx < 350) {
                if (currentMission === 1) advanceToNextMission();
                else startMission(2);
            } else {
                if (currentMission === 1) restartGame();
                else switchMission(1);
            }
        } else {
            restartGame();
        }
    }
});

canvas.addEventListener("pointerup", () => dropPlungerRelease());
canvas.addEventListener("pointercancel", () => dropPlungerRelease());
window.addEventListener("pointerup", () => dropPlungerRelease());

// Tiempo fijo: la lógica avanza a 60 pasos por segundo en cualquier pantalla
// (móvil de 90/120 Hz o PC lento); el dibujo se hace una vez por fotograma.
const STEP_MS = 1000 / 60;
let lastFrameTime = performance.now();
let stepAccumulator = 0;

function loop(now) {
    if (typeof now !== "number") now = performance.now();

    stepAccumulator += Math.min(100, now - lastFrameTime);
    lastFrameTime = now;

    while (stepAccumulator >= STEP_MS) {
        update();
        stepAccumulator -= STEP_MS;
    }

    draw();
    requestAnimationFrame(loop);
}

// Inicio de la misión.
loadSkills();
startMission();
showZoneMessage("ZONA 01: DESEMBARCO");

loop();
</script>
